moat_analyst_task:
  description: |
    Hoy es {current_date}. Analiza el Economic Moat y la ventaja competitiva de {target_name}.

    Sigue los pasos en orden estricto:
    1. Paso 0 — Lee de forma prioritaria el `{audit_context}`. Los números de márgenes y ROIC que contiene son tu verdad absoluta contable. No realices búsquedas financieras históricas duplicadas en internet.
    2. Paso 1 — Evalúa las 5 fuentes de foso competitivo, asigando a cada una su score numérico (0 a 3).
    3. Paso 2 — Compara con 2 o 3 competidores clave que busques con search_internet.
    4. Paso 2.5 — Somete a la empresa al Test Nokia/Kodak de obsolescencia y riesgo disruptivo de forma rigurosa y no benevolente.
    5. Paso 3 — Contrasta con la tesis real de mercado con search_bull_bear_thesis y simula un enfrentamiento de debate con simulate_bull_bear_debate.
    6. Scoring final holístico de franquicia (0-10) y veto si corresponde.

    CONTEXTO DE AUDITORÍA CRÍTICA (Paso 0):
    {audit_context}

    {methodology}

  expected_output: |
    # 💎 ANÁLISIS DE LA FRANQUICIA Y ECONOMIC MOAT — {target_name}
    > Análisis a fecha {current_date}

    [Inserta aquí la sección de MODELO DE NEGOCIO Y MONETIZACIÓN generada por el especialista de negocio si corre en el mismo Crew]

    ## 🛡️ 2. FUENTES DEL ECONOMIC MOAT
    | Tipo                | Score | Evidencia concreta          |
    |---------------------|-------|-----------------------------|
    | Activos Intangibles | X/3   |                             |
    | Switching Costs     | X/3   |                             |
    | Network Effects     | X/3   |                             |
    | Cost Advantage      | X/3   |                             |
    | Efficient Scale     | X/3   |                             |
    | **SUBTOTAL**        | X/15  |                             |

    ## 📊 2.5. TEST NOKIA/KODAK Y EVALUACIÓN DE RIESGO DISRUPTIVO MULTISECTORIAL
    - **Riesgo Tecnológico, Automatización e IA (Software/Tech):** [Análisis objetivo de si la IA, código abierto, o software puede desintermediar o automatizar su propuesta de valor]
    - **Riesgo de Cambios de Hábitos, Demografía o Salud (Consumo/Retail/Health):** [Evaluación de cambios en preferencias socioculturales, hábitos saludables o revoluciones médicas que vuelvan obsoleto su producto]
    - **Riesgo de Moda y Pérdida de Relevancia (Fads vs. Icons):** [Análisis de si la marca es un icono cultural blindado o una tendencia/moda pasajera con alto riesgo de pérdida de relevancia]
    - **Veredicto del Test Nokia/Kodak:** [Sin benevolencia pero con pragmatismo: ¿Es un foso duradero a 10 años, o hay riesgo real de obsolescencia? Explica tu razonamiento con rigurosidad]

    ## 📊 3. BENCHMARKING DE COMPETIDORES Y PRICING POWER
    - **Competidores Analizados:** [Nombres de los 2 o 3 competidores clave]
    - **Comparativa de Márgenes:** [¿Son los márgenes brutos y operativos superiores a sus pares? Detalle de márgenes]
    - **Comparativa de ROIC:** [¿Superior o inferior? Detalle]
    - **Pricing Power Real:** [¿Muestran capacidad de subir precios sin perder volumen?]

    ## ⚔️ 4. DEBATE EXTREMO BULL VS BEAR (TESIS DE MERCADO)
    - **Bull Case (Caso Alcista):** [Tesis real con fuentes]
    - **Bear Case (Caso Bajista):** [Tesis real con fuentes]
    - **Simulación del Debate Extremo:** [Resumen de la confrontación Bull vs Bear y veredicto sobre el riesgo principal]
    - **Conclusión del Analista (Juez):** [Tu veredicto sobre la incertidumbre y visibilidad a 10 años]

    ---
    [🛑 AVISO DE RECHAZO: Incluye este bloque aquí SOLO si la empresa suspende los vetos de viabilidad a largo plazo o es un "NO MOAT" in-invertible].

    ## ⭐ PUNTUACIÓN DE FRANQUICIA: X.X / 10
    **Moat Rating:** Wide Moat / Narrow Moat Stable / Narrow Moat Eroding / No Moat
    **Justificación:** [Breve justificación de la nota de franquicia asignada]

