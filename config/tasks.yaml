analyze_cashflow_task:
  description: |
    REGLA DE PRIORIDAD ABSOLUTA (CRÍTICA): La variable {raw_data_input} contiene los estados financieros ingresados manualmente por el usuario. Es tu fuente de verdad absoluta. ¡No busques datos financieros en internet si {raw_data_input} contiene números o tablas! Úsalos directamente y basa todo tu análisis en ellos. Solo utiliza herramientas de búsqueda externa para investigar el contexto cualitativo detrás de quema de caja transitoria, o si {raw_data_input} estuviera completamente vacío.
    
    Audita el Flujo de Caja de {target_name} basado en {raw_data_input}.
    Evalúa de forma autónoma la generación de caja real para encontrar fortalezas, riesgos y banderas rojas (FCF, Capex, SBC). Recuerda que la SBC (compensación basada en acciones) solo debe penalizarse si representa un porcentaje excesivamente alto, tiene una tendencia muy creciente y descontrolada, o genera una dilución neta real significativa en las acciones totales en circulación; los niveles moderados, estables o compensados por recompras eficientes son una práctica estándar normal de compensación y no deben penalizar la nota de flujo de caja.
    REGLA DE VERIFICACIÓN DE LÍNEAS ROJAS (CRÍTICA):
    Cuando detectes una anomalía o posible bandera roja, debes investigar activamente usando búsquedas en internet para determinar de forma equilibrada y rigurosa si se trata de un riesgo estructural real o si es un bache coyuntural plenamente justificado. No seas laxo ni justifiques sin pruebas rigurosas, pero tampoco califiques de línea roja letal algo que el contexto de la empresa o sector justifica plenamente.
  expected_output: |
    ### 💸 ANÁLISIS DE FLUJO DE CAJA
    **Nota de Flujo de Caja:** X.X / 10

    **Puntos Fuertes (Flujo de Caja):**
    - [Punto fuerte 1]
    - [Punto fuerte 2]

    **Puntos Débiles y Riesgos (Flujo de Caja):**
    - [Punto débil o riesgo 1]
    - [Punto débil o riesgo 2]

    **Análisis Detallado:**
    [Análisis conciso de flujo de caja, justificando la nota asignada]

forensic_audit_task:
  description: |
    Sintetiza la auditoría de {target_name} en una visión conjunta y holística del negocio basándote en los informes individuales de los especialistas proporcionados a continuación.
    1. Conecta los números para explicar el funcionamiento global del negocio: analiza de forma comprensiva cómo opera la empresa a través de la interacción de sus ventas, costes, balance y generación de caja, dando una visión unificada de su engranaje económico.
    2. Identifica fortalezas y evalúa si las banderas rojas encontradas son baches puntuales (justificados) o debilidades estructurales reales (Líneas Rojas letales).
    3. Emite un veredicto definitivo de invertibilidad: [APTO PARA ANÁLISIS / DESCARTE] y el Score de Auditoría (0-10).

    INFORMES DE ESPECIALISTAS (CONTEXTO):
    {audit_context}

    {methodology}

  expected_output: |
    # 🕵️ AUDITORÍA FORENSE INTEGRAL — {target_name}
    > Auditoría a fecha {current_date}

    ## 📊 1. ANÁLISIS DE RESULTADOS (P&L)
    [Resumen del especialista]

    ## ⚖️ 2. ANÁLISIS DEL BALANCE
    [Resumen del especialista]

    ## 💸 3. ANÁLISIS DE FLUJO DE CAJA
    [Resumen del especialista]

    ---

    ## 🌍 4. COMPRESIÓN DEL NEGOCIO, FORTALEZAS Y RIESGOS
    - **Visión Conjunta y Funcionamiento Global:** [Análisis holístico de cómo funciona operativamente la empresa a través de la interacción de sus números contables]
    - **Fortalezas Principales:** [Puntos fuertes clave]
    - **Riesgos y Banderas Rojas:** [Riesgos detectados y si son baches puntuales/justificados o estructurales/críticos]
    - **Veredicto Final de Invertibilidad:** [APTO PARA ANÁLISIS / DESCARTE]

    ## ⭐ SCORE DE AUDITORÍA: X.X / 10
    **Veredicto Forense:** [Breve justificación final de la viabilidad de la inversión]

