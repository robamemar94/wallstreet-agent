analyze_income_task:
  description: |
    REGLA DE PRIORIDAD ABSOLUTA (CRÍTICA): La variable {raw_data_input} contiene los estados financieros ingresados manualmente por el usuario. Es tu fuente de verdad absoluta. ¡No busques datos financieros en internet si {raw_data_input} contiene números o tablas! Úsalos directamente y basa todo tu análisis en ellos. Solo utiliza herramientas de búsqueda externa para investigar el contexto cualitativo detrás de caídas o baches sectoriales, o si {raw_data_input} estuviera completamente vacío.
    
    Audita la Cuenta de Resultados de {target_name} basada en {raw_data_input}.
    Evalúa de forma autónoma los números de ventas y márgenes para encontrar fortalezas, anomalías y banderas rojas.
    REGLA DE VERIFICACIÓN DE LÍNEAS ROJAS (CRÍTICA):
    Cuando detectes una anomalía o posible bandera roja, debes investigar activamente usando búsquedas en internet para determinar de forma equilibrada y rigurosa si se trata de un riesgo estructural real o si es un bache coyuntural plenamente justificado. No seas laxo ni justifiques sin pruebas rigurosas, pero tampoco califiques de línea roja letal algo que el contexto de la empresa o sector justifica plenamente.
  expected_output: |
    ### 📊 ANÁLISIS DE RESULTADOS (P&L)
    **Nota de Resultados:** X.X / 10

    **Puntos Fuertes (Resultados):**
    - [Punto fuerte 1]
    - [Punto fuerte 2]

    **Puntos Débiles y Riesgos (Resultados):**
    - [Punto débil o riesgo 1]
    - [Punto débil o riesgo 2]

    **Análisis Detallado:**
    [Análisis conciso de ingresos y márgenes, justificando la nota asignada]

