rules_pilar1_task:
  description: |
    Hoy es {current_date}. Como Auditor de Normas de Calidad, debes evaluar de forma rigurosa, exigente pero siempre justa y razonable el **Pilar 1: Foso Competitivo, Pricing Power y Riesgo Terminal** para {target_name}.

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Utiliza el contexto financiero real disponible en `{audit_context}`. Analiza el historial completo disponible (últimos 10 años).
    2. Realiza los cálculos matemáticos precisos para este pilar utilizando los datos fundamentales (p.ej. Margen Bruto, ventas, etc. de los últimos 10 años).
    3. Realiza el análisis estratégico, de pricing power y riesgo de obsolescencia bajo el marco conceptual de la "Escala de Grises del Foso" (0.0 a 2.0 puntos):
       - NOTA CRÍTICA: Un margen bruto alto (>50%) es una condición necesaria pero NO suficiente para un foso duradero. No te dejes cegar mecánicamente por márgenes altos si el negocio opera en un sector hiper-competitivo, carece de costes de cambio reales para el cliente, depende excesivamente de marketing constante o muestra desaceleraciones severas del crecimiento.
       - **Foso Ancho (Wide Moat) [Rango de 1.6 a 2.0 puntos]:** Reservado para empresas con barreras de entrada masivas, altos costes de cambio para el cliente, patentes, efectos de red o claras ventajas de escala monopolísticas respaldadas por márgenes excelentes y estables. El riesgo de obsolescencia a 10 años es casi nulo.
       - **Foso Estrecho (Narrow Moat) [Rango de 1.0 a 1.5 puntos]:** El negocio tiene ventajas operativas reales o nichos de marca, pero opera en un sector abierto y altamente competitivo, sin costes de cambio para el cliente y vulnerable a modas, saturación de canal, competidores agresivos o encarecimiento de la captación de clientes. Márgenes altos pero bajo amenaza de erosión si el crecimiento se desacelera a un dígito (como es el caso de RVRC.ST, el cual debe calificarse con un escepticismo riguroso en este rango, p.ej. entre 1.0 y 1.2 puntos).
       - **Sin Foso o Ventaja Erosionada (No Moat) [Rango de 0.0 a 0.9 puntos]:** El producto está comoditizado, el negocio carece de poder de fijación de precios, los márgenes brutos se deterioran persistentemente por debajo del 50%, o encara un riesgo terminal existencial crítico en los próximos 10 años.
       - Si el incumplimiento se debe a una anomalía COYUNTURAL o CÍCLICA transitoria pero los fundamentos del foso estratégico de largo plazo permanecen intactos, puedes otorgar una nota aprobada justa sin castigar con el 0.0 automático.
    4. El tono debe ser de escepticismo profesional equilibrado. Eres un auditor de calidad analítico que busca proteger el capital a largo plazo.
    5. Para el bloque final XML de <resumen> exigido por las instrucciones del sistema:
       - En <score> debes indicar la puntuación obtenida para este pilar (ej. 1.2/2.0 o 0.0/2.0). **NO evalúes ni des una puntuación global sobre 10.0, solo da la nota sobre 2.0 para este pilar.**
       - En <pros> debes listar en elementos <item> los puntos fuertes de este pilar.
       - En <cons> debes listar en elementos <item> las debilidades, riesgos o banderas rojas de este pilar.

    ════════════════════════════════════════════
    NORMAS DE CALIDAD DEL USUARIO (DEBES EVALUAR CADA UNA)
    ════════════════════════════════════════════
    {custom_evaluation_rules}

    {methodology}

  expected_output: |
    # AUDITORÍA DE NORMAS DE CALIDAD DE INVERSIÓN — {target_name}
    > Evaluación del Pilar 1 a fecha {current_date}

    ## INFORME DE AUDITORÍA: Pilar 1: Foso Competitivo, Pricing Power y Riesgo Terminal
    * **Puntuación del Pilar:** X.X / 2.0 Puntos
    * **Estado:** [Aprobado / Suspenso / Excelente]

    ### Desarrollo Analítico:
    - Tabla de margen bruto por año (últimos 10 años).
    - Interpretación operativa: análisis de pricing power, ventajas de costes, cambios de mix o erosión competitiva.
    - Riesgos estructurales: análisis del riesgo terminal a 10 años (obsolescencia, regulación, sustitución por software/IA, cambio generacional o pérdida de relevancia).

rules_pilar2_task:
  description: |
    Hoy es {current_date}. Como Auditor de Normas de Calidad, debes evaluar de forma rigurosa, exigente pero siempre justa y razonable el **Pilar 2: Crecimiento de Ventas, FCF Total y BPA** para {target_name}.

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Utiliza el contexto financiero real disponible en `{audit_context}`. Analiza el historial completo disponible (últimos 10 años).
    2. Realiza los cálculos matemáticos precisos para este pilar utilizando los datos fundamentales (p.ej. ingresos, acciones en circulación, beneficio neto, FCF total) y calcula el CAGR de Ingresos, CAGR del FCF Total (no por acción, para medir el crecimiento a escala pura de la caja generada por el negocio) y el CAGR de BPA (BPA/EPS) a 3, 5 y 10 años.
    3. Realiza el cálculo exacto de CAGR o medias y aplícalo de forma objetiva sobre los 10 años de historial. 
       - REGLA CRÍTICA DE EXCELENCIA Y ANÁLISIS DE TENDENCIAS: El ancla principal para calificar con excelencia (2.0 de 2.0 puntos) es el largo plazo (10 años), donde buscamos un crecimiento sostenible de ingresos (ventas) superior al 8% CAGR Y un crecimiento de FCF Total superior al 10% CAGR.
       - Los periodos más cortos o intermedios (3 y 5 años) deben analizarse únicamente como tendencias de trayectoria y contexto de ciclo de crecimiento, no como umbrales eliminatorios de exclusión automática. Un bache en el corto plazo (debido a ciclicidad, inversiones puntuales, pandemia, etc.) es totalmente aceptable siempre y cuando los fundamentales estructurales de largo plazo permanezcan intactos.
       - Si la empresa no alcanza los límites de largo plazo (10 años), debes puntuar bajo (suspenso, de 0.0 a 0.5 puntos), SALVO que se encuentre en un rango de tolerancia muy cercano (ej: ventas del 7.5% o FCF del 9.5%), en cuyo caso, o si tiene fundamentales de largo plazo excepcionales batiendo algún bache temporal, puedes otorgar una nota aprobada intermedia en el rango de 1.0 a 1.5 puntos.
       - Distingue con criterio sensato: si el corto plazo muestra una tendencia de deterioro estructural claro, irreversible y permanente (pérdida definitiva de foso o contracción continua de ventas), puntúa mal de forma rigurosa.
       - NOTA CRÍTICA: En este pilar solo debes evaluar y puntuar el crecimiento de las métricas puras y su tracción operativa. Toda la auditoría forense sobre si la dilución por SBC es abusiva, si las recompras destruyen valor o si se está manipulando artificialmente el BPA se delega de forma centralizada al **Pilar 5**.
    4. El tono debe ser de escepticismo profesional equilibrado. Eres un auditor de calidad analítico que busca proteger el capital a largo plazo.
    5. Para el bloque final XML de <resumen> exigido por las instrucciones del sistema:
       - En <score> debes indicar la puntuación obtenida para este pilar (ej. 1.5/2.0 o 0.0/2.0). **NO evalúes ni des una puntuación global sobre 10.0, solo da la nota sobre 2.0 para este pilar.**
       - En <pros> debes listar en elementos <item> los puntos fuertes de este pilar.
       - En <cons> debes listar en elementos <item> las debilidades o riesgos.

    ════════════════════════════════════════════
    NORMAS DE CALIDAD DEL USUARIO (DEBES EVALUAR CADA UNA)
    ════════════════════════════════════════════
    {custom_evaluation_rules}

    {methodology}

  expected_output: |
