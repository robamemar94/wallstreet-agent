analyze_income_task:
  description: |
    Audita la Cuenta de Resultados de {target_name} (ventas, márgenes y beneficios) para encontrar fortalezas, anomalías y banderas rojas.

    {forensic_data_rules}

    ESTADO QUE AUDITAS (Cuenta de Resultados, pegada por el usuario):
    {raw_data_input}

    CONTEXTO (los otros dos estados, para cruzar; no los audites, eso lo hacen tus compañeros):
    {other_statements}

    {ratios_context}

    QUÉ MIRAR COMO MÍNIMO:
    - Crecimiento: orgánico frente a adquirido (si hay pagos por adquisiciones en el flujo de caja), y si se acelera o frena.
    - Márgenes bruto y operativo a lo largo del ciclo: estabilidad, expansión o erosión, y su causa (mix, precios, costes).
    - Calidad del beneficio: partidas no recurrentes u «otros» que inflen el resultado, tipo fiscal anómalo, y si el beneficio neto se convierte en caja (CFO/Beneficio neto en los ratios).
    - Dilución: evolución de las acciones diluidas frente al BPA.

    {forensic_red_flag_rule}

    {forensic_score_scale}
  expected_output: |
    ### 📊 ANÁLISIS DE RESULTADOS (P&L)
    **Nota de Resultados:** X.X / 10

    **Puntos Fuertes (Resultados):**
    - [Punto fuerte 1, con la cifra que lo demuestra]
    - [Punto fuerte 2]

    **Puntos Débiles y Riesgos (Resultados):**
    - [Punto débil o riesgo 1, con la cifra]
    - [Punto débil o riesgo 2]

    **Análisis Detallado:**
    [Análisis conciso de ingresos y márgenes, justificando la nota asignada con la escala]

analyze_balance_task:
  description: |
    Audita el Balance de {target_name} (solvencia, liquidez, estructura de deuda y calidad de los activos) para identificar fortalezas, riesgos y banderas rojas.

    {forensic_data_rules}

    ESTADO QUE AUDITAS (Balance, pegado por el usuario):
    {raw_data_input}

    CONTEXTO (los otros dos estados, para cruzar; no los audites, eso lo hacen tus compañeros):
    {other_statements}

    {ratios_context}

    QUÉ MIRAR COMO MÍNIMO:
    - Deuda neta/EBITDA y cobertura de intereses, y su tendencia; vencimientos si los encuentras.
    - Circulante: cuentas por cobrar e inventario creciendo más que las ventas (DSO/DIO en los ratios) = posible forzado de ventas u obsolescencia.
    - Fondo de comercio e intangibles frente al patrimonio: riesgo de deterioros y si el crecimiento se ha comprado.
    - Patrimonio negativo o decreciente: distingue si es por recompras (aceptable con caja fuerte) o por pérdidas.
    - Altman Z'' de los ratios como señal de estrés (no como sentencia).

    {forensic_red_flag_rule}

    {forensic_score_scale}
  expected_output: |
    ### ⚖️ ANÁLISIS DEL BALANCE
    **Nota de Balance:** X.X / 10

    **Puntos Fuertes (Balance):**
    - [Punto fuerte 1, con la cifra que lo demuestra]
    - [Punto fuerte 2]

    **Puntos Débiles y Riesgos (Balance):**
    - [Punto débil o riesgo 1, con la cifra]
    - [Punto débil o riesgo 2]

    **Análisis Detallado:**
    [Análisis conciso de solvencia y deuda, justificando la nota asignada con la escala]

analyze_cashflow_task:
  description: |
    Audita el Flujo de Caja de {target_name} (generación de caja real, FCF, Capex, SBC) para encontrar fortalezas, riesgos y banderas rojas.

    {forensic_data_rules}

    ESTADO QUE AUDITAS (Flujo de Caja, pegado por el usuario):
    {raw_data_input}

    CONTEXTO (los otros dos estados, para cruzar; no los audites, eso lo hacen tus compañeros):
    {other_statements}

    {ratios_context}

    QUÉ MIRAR COMO MÍNIMO:
    - Conversión: CFO y FCF frente al beneficio neto, de forma sostenida (no un año suelto).
    - Capex frente a amortizaciones: < 1 de forma sostenida = posible infra-inversión; capitalización de gastos operativos (intangibles comprados o desarrollo capitalizado creciendo rápido).
    - Circulante: si el CFO depende de estirar proveedores o de cobros anticipados no repetibles.
    - SBC: solo penaliza si es excesiva (p. ej. > 15-20% del FCF), crece sin control o genera dilución neta real; niveles moderados, estables o compensados con recompras eficientes son práctica normal y no restan.
    - Dependencia externa: si las recompras y dividendos se pagan con caja propia o con deuda.

    {forensic_red_flag_rule}

    {forensic_score_scale}
  expected_output: |
    ### 💸 ANÁLISIS DE FLUJO DE CAJA
    **Nota de Flujo de Caja:** X.X / 10

    **Puntos Fuertes (Flujo de Caja):**
    - [Punto fuerte 1, con la cifra que lo demuestra]
    - [Punto fuerte 2]

    **Puntos Débiles y Riesgos (Flujo de Caja):**
    - [Punto débil o riesgo 1, con la cifra]
    - [Punto débil o riesgo 2]

    **Análisis Detallado:**
    [Análisis conciso de flujo de caja, justificando la nota asignada con la escala]

forensic_audit_task:
  description: |
    Sintetiza la auditoría de {target_name} en una visión conjunta del negocio. Tienes los informes de los tres especialistas, las cuentas y los ratios forenses calculados en Python.
    1. Comprueba los informes contra los números: si un especialista afirma algo que las cuentas o los ratios contradicen, corrígelo y dilo.
    2. Haz los CRUCES ENTRE ESTADOS que ningún especialista puede hacer por separado (sección obligatoria):
       - Beneficio neto frente a CFO y FCF (¿el beneficio es caja?).
       - Cuentas por cobrar e inventario frente a ventas (¿se fuerzan ventas?).
       - Capex frente a amortizaciones e intangibles comprados (¿se capitalizan gastos o se infra-invierte?).
       - Fondo de comercio y pagos por adquisiciones frente al crecimiento (¿crecimiento comprado?).
       - Recompras/dividendos frente a FCF y deuda emitida (¿se remunera con caja propia o con deuda?).
       - Partidas «otros» o no recurrentes que expliquen una parte material del beneficio.
    3. Identifica fortalezas y evalúa si las banderas rojas son baches puntuales (justificados) o debilidades estructurales (Líneas Rojas letales).
    4. Emite un veredicto de invertibilidad: [APTO PARA ANÁLISIS / DESCARTE] y el Score de Auditoría (0-10) con la escala.

    INFORMES DE ESPECIALISTAS:
    {audit_context}

    CUENTAS (tal como las pegó el usuario):
    {raw_data_input}

    {ratios_context}

    {forensic_score_scale}

    {methodology}

  expected_output: |
    # 🕵️ AUDITORÍA FORENSE INTEGRAL — {target_name}
    > Auditoría a fecha {current_date}

    ## 📊 1. ANÁLISIS DE RESULTADOS (P&L)
    [Resumen del especialista, corregido si los números lo contradicen]

    ## ⚖️ 2. ANÁLISIS DEL BALANCE
    [Resumen del especialista, corregido si los números lo contradicen]

    ## 💸 3. ANÁLISIS DE FLUJO DE CAJA
    [Resumen del especialista, corregido si los números lo contradicen]

    ## 🔗 4. CRUCES ENTRE ESTADOS
    | Cruce | Lectura (con cifras) | Flag |
    |---|---|---|
    | Beneficio neto vs CFO/FCF | ... | 🟢/🟡/🔴 |
    | Cobros e inventario vs ventas | ... | 🟢/🟡/🔴 |
    | Capex vs amortizaciones / intangibles | ... | 🟢/🟡/🔴 |
    | Fondo de comercio y M&A vs crecimiento | ... | 🟢/🟡/🔴 |
    | Remuneración al accionista vs FCF y deuda | ... | 🟢/🟡/🔴 |
    | Partidas no recurrentes / «otros» | ... | 🟢/🟡/🔴 |

    ---

    ## 🌍 5. COMPRENSIÓN DEL NEGOCIO, FORTALEZAS Y RIESGOS
    - **Visión Conjunta y Funcionamiento Global:** [Cómo funciona la empresa a través de la interacción de sus números]
    - **Fortalezas Principales:** [Puntos fuertes clave]
    - **Riesgos y Banderas Rojas:** [Riesgos detectados y si son baches puntuales/justificados o estructurales/críticos]
    - **Veredicto Final de Invertibilidad:** [APTO PARA ANÁLISIS / DESCARTE]

    ## ⭐ SCORE DE AUDITORÍA: X.X / 10
    **Veredicto Forense:** [Breve justificación final de la viabilidad de la inversión]

business_model_task:
  description: |
    Hoy es {current_date}. Analiza el modelo de negocio y monetización de {target_name}.

    Sigue los pasos en orden estricto:
    1. Paso 1 — Cómo genera ingresos: segmentos y geografías CON SU PESO EN % (búscalo en el último informe anual con search_internet), clientes clave e ingresos recurrentes frente a transaccionales.
    2. Paso 2 — Estructura de costes, unit economics y apalancamiento operativo, respaldado con los ratios de abajo (evolución de márgenes), no con teoría.
    3. Paso 3 — Ciclicidad, posición en la cadena de valor y mapa de riesgos comerciales con su mitigación.
    Como mucho 5 búsquedas.

    RATIOS FORENSES (calculados en Python a partir de las cuentas):
    {ratios_context}

    {methodology}

  expected_output: |
    ## 🗺️ 1. MODELO DE NEGOCIO Y MONETIZACIÓN
    - **A qué se dedica:** [DOS frases cortas, 170 caracteres en total como máximo, sin el nombre de la empresa: qué vende y a quién, y de dónde sale el dinero. Ej.: «Fabrica turbocompresores para los motores grandes de barcos, centrales y trenes. La mayor parte del beneficio viene del mantenimiento de los ya instalados.»]
    - **¿Cómo genera valor e ingresos?:** [Modelo de monetización con el peso en % de cada segmento y geografía]
    - **Recurrencia y Ciclicidad:** [% de ingresos recurrentes (suscripción, mantenimiento, consumibles) frente a transaccionales; sensibilidad al ciclo económico]
    - **Unit Economics y Apalancamiento Operativo:** [Métricas de unidad del sector (CAC/LTV, ticket y frecuencia, utilización…) y qué muestran los márgenes cuando crecen las ventas]
    - **Posición en la Cadena de Valor:** [Quién le vende, a quién vende y quién captura el margen]
    - **Catalizadores de Crecimiento:** [Principales factores de aceleración del negocio en el mediano plazo]
    - **Riesgos Comerciales:** [Concentración de clientes, regulación, etc., y cómo los mitiga]

moat_analyst_task:
  description: |
    Hoy es {current_date}. Analiza el Economic Moat y la ventaja competitiva de {target_name}. Ya tienes el análisis de modelo de negocio de tu compañero: no lo repitas, úsalo.

    Sigue los pasos en orden estricto:
    1. Paso 0 — Lee el CONTEXTO DE AUDITORÍA (más abajo): sus cuentas y ratios son tu verdad contable. No hagas búsquedas financieras históricas.
    2. Paso 1 — Prueba empírica del foso: ROIC frente a coste de capital y estabilidad de márgenes en los últimos 10 años.
    3. Paso 2 — Puntúa cada fuente de foso (0 a 3) con evidencia concreta; marca la fuente primaria, su durabilidad y la tendencia del foso.
    4. Paso 3 — Competidores (2 o 3, con search_internet), poder de clientes y proveedores, métricas de clientes y recorrido de reinversión.
    5. Paso 4 — Test Nokia/Kodak con probabilidad y horizonte para cada riesgo.
    6. Paso 5 — Tesis real de mercado con search_bull_bear_thesis (una vez) y escenario de muerte del foso.
    7. Scoring final (0-10) aplicando la tasa base y los umbrales, y veto si corresponde.
    Como mucho 6 búsquedas en total.

    CONTEXTO DE AUDITORÍA CRÍTICA (Paso 0):
    {audit_context}

    {methodology}

  expected_output: |
    # 💎 ANÁLISIS DE LA FRANQUICIA Y ECONOMIC MOAT — {target_name}
    > Análisis a fecha {current_date}

    ## 📈 2. PRUEBA EMPÍRICA DEL FOSO
    - **ROIC vs coste de capital:** [En cuántos de los últimos N años lo supera y por cuánto; tendencia]
    - **Estabilidad de márgenes en el ciclo:** [Bruto y operativo en años buenos y malos]
    - **Conclusión empírica:** [¿Los números muestran un foso? WIDE / NARROW / NINGUNO según los umbrales]

    ## 🛡️ 3. FUENTES DEL ECONOMIC MOAT
    | Fuente | Score | Evidencia concreta (dato o hecho) |
    |---|---|---|
    | Activos Intangibles | X/3 | |
    | Regulación / Licencias | X/3 | |
    | Switching Costs | X/3 | |
    | Network Effects | X/3 | |
    | Cost Advantage / Escala | X/3 | |
    | Efficient Scale | X/3 | |
    | Counter-positioning | X/3 | |
    | Cornered Resource / Process Power | X/3 | |
    - **Fuente primaria:** [Cuál y por qué]
    - **Durabilidad estimada:** [X años]
    - **Tendencia del foso:** [Ensanchándose / Estable / Erosionándose] — [evidencia]

    ## 📊 4. COMPETENCIA, PODER DE NEGOCIACIÓN Y RECORRIDO
    - **Competidores Analizados:** [Nombres de los 2 o 3 competidores clave]
    - **Comparativa de Márgenes y ROIC:** [Frente a sus pares, con cifras]
    - **Poder de Clientes y Proveedores:** [Concentración, dependencia, riesgo de integración vertical]
    - **Métricas de Clientes:** [Retención / NRR / churn / % recurrente, si aplican]
    - **Recorrido de Reinversión:** [Tamaño de mercado, cuota actual, capacidad de reinvertir con ROIC alto]

    ## 📊 5. TEST NOKIA/KODAK Y EVALUACIÓN DE RIESGO DISRUPTIVO MULTISECTORIAL
    | Riesgo | Probabilidad | Horizonte | Barrera que lo contiene |
    |---|---|---|---|
    | [Tecnología / IA / sustitución] | Baja/Media/Alta | X años | |
    | [Hábitos, demografía o salud] | Baja/Media/Alta | X años | |
    | [Moda frente a icono] | Baja/Media/Alta | X años | |
    - **Veredicto del Test Nokia/Kodak:** [¿Foso duradero a 10 años o riesgo real de obsolescencia? Razonado y sin alarmismo]

    ## ⚔️ 6. TESIS DE MERCADO Y ESCENARIO DE MUERTE DEL FOSO
    - **Bull Case:** [Tesis real con fuentes]
    - **Bear Case:** [Tesis real con fuentes]
    - **Escenario de muerte del foso más probable:** [Qué tendría que pasar y probabilidad]
    - **Conclusión del Juez:** [Tu veredicto sobre la incertidumbre y visibilidad a 10 años]

    ---
    [🛑 AVISO DE RECHAZO: Incluye este bloque aquí SOLO si la empresa suspende los vetos de viabilidad a largo plazo o es un "NO MOAT" in-invertible].

    ## ⭐ PUNTUACIÓN DE FRANQUICIA: X.X / 10
    **Moat Rating:** Wide Moat / Narrow Moat Stable / Narrow Moat Eroding / No Moat
    **Justificación:** [Breve justificación de la nota de franquicia con la prueba empírica y la fuente primaria]
    **Qué cambiaría la nota:** [Un hecho observable que la subiría un nivel y otro que la bajaría]

evaluate_management_task:
  description: |
    Hoy es {current_date}. Evalúa al equipo directivo y su alineación de intereses para {target_name}.

    Sigue los pasos en orden estricto:
    1. Paso 1 — Busca el Proxy DEF 14A con buscar_sec_filings para analizar la propiedad agregada del CEO y directiva.
    2. Paso 2 — Audita la estructura de incentivos y bonus: qué métricas rigen su sueldo variable.
    3. Paso 3 — Analiza noticias corporativas y la transcripción del último earnings call con buscar_transcripcion_earnings para evaluar franqueza y honestidad.

    {methodology}

  expected_output: |
    ## 👔 1. ALINEACIÓN E INCENTIVOS (PROXY DEF 14A)
    - **Skin in the Game (Propiedad del CEO):** [Porcentaje de acciones en propiedad de la directiva]
    - **Estructura de Incentivos y Bonus:** [¿Están vinculados a métricas de creación de valor (ROIC/FCF por acción) o crecimiento de tamaño?]
    - **Opinión sobre la Alineación:** [Breve veredicto sobre si están alineados con el accionista minoritario]
    - **Integridad y Q&A:** [Grado de honestidad al responder analistas en el earnings call]

capital_allocation_task:
  description: |
    Hoy es {current_date}. Evalúa la asignación histórica de capital (The Outsiders Test) para {target_name}.

    Sigue los pasos en orden estricto:
    1. Paso 0 — Lee de forma prioritaria el CONTEXTO DE AUDITORÍA (más abajo). Los números de recompras, SBC, dividendos, M&A y los ratios forenses (ROIC aprox., SBC/FCF, variación de acciones) son tu verdad contable. No realices búsquedas financieras históricas duplicadas en internet.
    2. Paso 1 — Evalúa la política de recompras de acciones (oportunistas o mecánicas en máximos) y el impacto dilutivo neto del Stock-Based Compensation (SBC).
    3. Paso 2 — Analiza de forma rigurosa la tasa de retorno incremental de capital (ROIC) y el historial de adquisiciones M&A de los últimos 10 años (calculando de forma explícita el ROIC total medio a 10 años, el ROIC tangible sin Goodwill, y la evolución del ROIIC a 10, 5 y 3 años para juzgar la trayectoria completa de la directiva, y no únicamente el corto plazo reciente).
    4. Scoring final de asignación (0-10) y veto si corresponde.

    CONTEXTO DE AUDITORÍA CRÍTICA (Paso 0):
    {audit_context}

    {methodology}

  expected_output: |
    # 👔 DIRECCIÓN Y ASIGNACIÓN DE CAPITAL (OUTSIDERS TEST) — {target_name}
    > Análisis a fecha {current_date}

    ## ⚙️ 2. DECISIONES DE ASIGNACIÓN DE CAPITAL (CAPITAL ALLOCATION)
    - **Recompras de Acciones:** [¿Recompras oportunistas a múltiplos bajos o mecánicas para cubrir dilución?]
    - **Dilución y SBC:** [¿SBC controlada o destructiva? Impacto neto en el número de acciones en circulación]
    - **Retorno sobre Capital (ROIC):** [¿Genera valor la reinversión de capital en el negocio?]
    - **Historial de M&A (Adquisiciones):** [¿Adquisiciones pequeñas y rentables o adquisiciones destructivas impulsadas por el ego?]

    ---
    [🛑 AVISO DE RECHAZO: Incluye este bloque aquí SOLO si has detectado destrucción sistemática de capital o graves problemas de integridad en la directiva].

    ## ⭐ PUNTUACIÓN DE DIRECCIÓN Y CAPITAL: X.X / 10
    **Perfil Directivo:** Outsider / Alineación Excelente / Aceptable / Gestión Frágil / Peligroso
    **Justificación:** [Explicación de la nota asignada]

investment_director_task:
  description: |
    Hoy es {current_date}. Como Director de Inversiones, asume un enfoque de síntesis definitiva, de alto nivel y riguroso pero dotado de un profundo sentido pragmático y sensatez. Tu tarea es analizar y englobar todas las conclusiones previas de los agentes de calidad para {target_name} para emitir un veredicto definitivo de calidad/invertibilidad y una Nota de Calidad unificada.

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Revisa los informes previos buscando banderas rojas o avisos de rechazo. Evalúa críticamente si el bache es de carácter temporal, puntual, reconocido y ya solucionado por la directiva, en cuyo caso aplica un castigo severo y restrictivo restando de forma drástica en el pilar afectado (ej: de -3.0 a -4.0 puntos), adviértelo en la tesis, pero NO decretes un descarte binario automático irracional si el resto de pilares (moat, balance, capital allocation Outsider, ROIC) son de una calidad excepcional (élite). Esto castigará fuertemente la nota general (quedando en un rango estricto de 5.5 a 6.5 para exigir un margen de seguridad colosal en valoración), pero la mantendrá en el radar de seguimiento. Reserva el descarte directo y las notas ≤ 4 únicamente para peligros estructurales continuos, falta de integridad flagrante, fraude o destrucción sistemática de capital que comprometa permanentemente la invertibilidad.
    2. Realiza una síntesis crítica, equilibrada y holística de todo el conjunto.
    3. Calcula y asigna la Nota de Calidad Global (Score Final) (0-10) ponderando:
       - 35% Calidad de Franquicia y Moat (informe A)
       - 35% Dirección y Asignación de Capital (informe B)
       - 30% Auditoría Financiera Forense Histórica (informe C)
       - Sopesa también las Normas de Calidad (informe D) para restar puntos si incumple reglas inquebrantables.
    4. Si existe el stress-test del abogado del diablo (informe E), tenlo en cuenta: cada amenaza de probabilidad ALTA debe quedar rebatida con datos o restar puntos en el pilar que ataca. No lo ignores ni lo copies; júzgalo.
    5. Escribe la tesis cualitativa definitiva e indica el veredicto de Fase 1: [APTO PARA VALORACIÓN / DESCARTE DIRECTO].
    6. Para finalizar el informe, utiliza la herramienta `get_company_events` con el ticker {ticker} para obtener el calendario de próximos eventos y añádelo en la sección correspondiente.

    ANÁLISIS PREVIOS (cada informe aparece una sola vez; refiérete a ellos por su letra):

    ── A. CALIDAD DE FRANQUICIA Y MOAT ──
    {franchise_context}

    ── B. DIRECCIÓN Y ASIGNACIÓN DE CAPITAL ──
    {mgmt_alloc_context}

    ── C. AUDITORÍA FINANCIERA FORENSE (síntesis, cuentas y ratios) ──
    {audit_context}

    ── D. NORMAS DE CALIDAD ──
    {rules_context}

    ── E. STRESS-TEST DEL ABOGADO DEL DIABLO ──
    {destroyer_context}

    {methodology}

  expected_output: |
    # VEREDICTO DE INVERSIÓN (CALIDAD FASE 1) — {target_name}
    > Síntesis a fecha {current_date}

    ## 1. RESUMEN DE PILARES DE CALIDAD
    | Pilar                                | Score | Perfil / Veredicto del Analista |
    |--------------------------------------|-------|---------------------------------|
    | 1. Calidad de Franquicia y Moat      | X/10  | [Ej: WIDE MOAT SÓLIDO]          |
    | 2. Dirección y Asignación de Capital  | X/10  | [Ej: DIRECTIVA OUTSIDER]        |
    | 3. Auditoría Financiera Forense      | X/10  | [Ej: EXCELENTE / SIN RIESGOS]   |
    | 4. Normas de Calidad (Checklist)     | X/10  | [Ej: 4 DE 5 PILARES SUPERADOS]  |

    ## 2. EVALUACIÓN DE RIESGO ESTRUCTURAL Y VETOS
    **Banderas Rojas Críticas y Avisos de Rechazo:**
    > [Resume las peores banderas rojas encontradas por los analistas. Si hay alguna nota <= 4 o si algún informe contiene un "🛑 AVISO DE RECHAZO", indícalo claramente aquí y marca la empresa para descarte inmediato. Si todo está sano, indica "Ningún defecto estructural grave detectado".]
    **Amenazas del Abogado del Diablo:** [Solo si existe el informe E: para cada amenaza Media/Alta, si queda rebatida (y con qué dato) o si resta puntos y a qué pilar. Si no existe, omite esta línea.]

    ## 3. MATRIZ MULTIFACTORIAL Y CALIDAD GLOBAL
    - **Nota de Calidad Global (Score):** X.X / 10
    - **Arquetipo de Inversión:** [Ej: 💎 COMPOUNDER / 🧠 COMPOUNDER "OUTSIDER" / 🏰 CASTILLO DORMIDO / etc.]
    - **Justificación del Arquetipo:** [Explica brevemente por qué encaja en este perfil según el cruce específico de sus 3 notas].

    ---
    ## ⭐ SCORE FINAL (Fase 1): X.X / 10
    ## 📋 VEREDICTO DE FILTRO (Paso 7): [APTO PARA VALORACIÓN / DESCARTE DIRECTO]

    ## 4. SÍNTESIS Y VEREDICTO FINAL
    > [Párrafo contundente resumiendo si la empresa tiene calidad excepcional para ser digna de nuestro capital, integrando foso, números y capitanes de forma lógica y sin eufemismos.]

    ## 5. PRÓXIMOS EVENTOS Y CATALIZADORES
    *   **Próxima Fecha de Resultados (Earnings):** [Fecha de la próxima presentación de resultados]
    *   **Pago de Dividendos:** [Información sobre el próximo dividendo (fecha, cantidad), o "No aplica" si la empresa no paga dividendos]

rules_auditor_task:
  description: |
    Hoy es {current_date}. Como Auditor de Normas de Calidad, debes evaluar de forma rigurosa, exigente pero siempre justa y razonable las Normas de Calidad de Inversión (Paso 0 y los 5 Pilares) para {target_name}.

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Utiliza el CONTEXTO DE AUDITORÍA (más abajo: síntesis forense, cuentas y ratios forenses ya calculados en Python). Analiza el historial completo disponible (la última década / últimos 10 años). Usa los ratios calculados en lugar de recalcularlos; calcula solo lo que falte (p. ej. CAGR).
    2. Realiza los cálculos matemáticos precisos para cada uno de los pilares utilizando los datos fundamentales (p.ej. Margen Bruto, FCF, CAGR de ingresos y FCF/Share a 3, 5 y 10 años, ROIC con/sin Goodwill, EBITDA, Deuda Económica, Quick ratio, ROIIC a 3, 5 y 10 años, recompras, SBC, etc.).
    3. Para cada pilar, realiza el cálculo exacto de CAGR o medias y aplícalo de forma objetiva sobre los 10 años de historial. Si la empresa no cumple los mínimos, califícalo con un 0.0 de forma justa pero rigurosa.
    4. El tono debe ser de escepticismo profesional equilibrado. Eres un auditor de calidad analítico que busca proteger el capital a largo plazo; por lo tanto, no seas complaciente ni laxo ante debilidades reales, pero sé razonable, constructivo y basado exclusivamente en hechos. No asumas riesgos catastróficos o paranoicos de disrupción sin justificación o indicios reales en los datos, pero tampoco ignores los riesgos obvios.
    5. Para el bloque final XML de <resumen> exigido por las instrucciones del sistema:
       - En <score> debes indicar la puntuación de calidad total obtenida (ej. 8.25/10).
       - En <pros> (Pilares Destacados) debes listar en elementos <item> cada uno de los pilares que obtuvieron buena puntuación (ej: <item>Pilar 1: Foso Competitivo [Sólido, 2.0 p.]</item>).
       - En <cons> (Pilares Débiles) debes listar en elementos <item> cada uno de los pilares con baja puntuación o riesgos (ej: <item>Pilar 3: Eficiencia del Capital [Débil, 0.0 p.]</item>).

    MÉTRICAS DE LOS PILARES (calculadas en Python):
    {pillar_metrics}

    CONTEXTO DE AUDITORÍA:
    {audit_context}

    ════════════════════════════════════════════
    NORMAS DE CALIDAD DEL USUARIO (DEBES EVALUAR CADA UNA)
    ════════════════════════════════════════════
    {custom_evaluation_rules}

    {methodology}

  expected_output: |
    # AUDITORÍA DE NORMAS DE CALIDAD DE INVERSIÓN — {target_name}
    > Evaluación rigurosa a fecha {current_date}

    ## 1. INFORME DE AUDITORÍA GENERAL
    * **Puntuación de Calidad Total:** X.XX / 10.0 (Suma de los 5 Pilares, de 0 a 2.0 puntos cada uno)
    * **Clasificación del Activo:** [Calidad Élite ("Core") / Calidad Sólida ("Satélite") / Calidad Insuficiente (Descarte)]
    * **Veredicto del Auditor:** [Un párrafo contundente de por qué cumple o suspende los estándares].

    ## 2. EVALUACIÓN DETALLADA PASO A PASO

    ### 📋 Paso 0: Carga, Normalización y Consistencia de Datos
    * **Resultado/Confirmación:** [Breve confirmación de que los datos están listos, con lista de posibles inconsistencias].

    ### 🛡️ Pilar 1: Foso Competitivo, Pricing Power y Riesgo Terminal
    * **Puntuación:** X.X / 2.0 Puntos
    * **Desarrollo Analítico:**
      - Tabla de margen bruto por año (últimos 10 años).
      - Interpretación operativa: análisis de pricing power, ventajas de costes, o erosión competitiva.
      - Riesgos estructurales: análisis del riesgo terminal a 10 años (obsolescencia, regulación, sustitución por software/IA, cambio generacional o pérdida de relevancia).

    ### 📈 Pilar 2: Crecimiento de Ventas, FCF Total y BPA
    * **Puntuación:** X.X / 2.0 Puntos
    * **Desarrollo Analítico:**
      - Cálculos y tabla de métricas (Ingresos, FCF Total y BPA CAGR a 3, 5 y 10 años, evolución de acciones en circulación, y análisis de dilución).

    ### ⚙️ Pilar 3: ROIC, Márgenes y Eficiencia del Capital
    * **Puntuación:** X.X / 2.0 Puntos
    * **Desarrollo Analítico:**
      - Cálculos y tabla de ratios de los últimos 10 años (ROIC promedio a 10 años con y sin goodwill, margen EBIT medio a 10 años).

    ### 🏰 Pilar 4: Solvencia, Liquidez y Riesgo de Refinanciación
    * **Puntuación:** X.X / 2.0 Puntos
    * **Desarrollo Analítico:**
      - Cálculos y tabla de ratios de los últimos 10 años (Deuda económica total / FCF, Quick ratio ajustado, FCF / EBITDA).

    ### 👔 Pilar 5: Asignación de Capital, ROIIC, Recompra, SBC y Gobernanza
    * **Puntuación:** X.X / 2.0 Puntos
    * **Desarrollo Analítico:**
      - Cálculos de los últimos 10 años (ROIIC a 3, 5 y 10 años, evolución de recompra de acciones, SBC como % de FCF operativo o FCF, gobernanza).

    ## 3. RESUMEN DE PUNTUACIONES
    | Pilar | Puntuación Obtenida | Máximo | ¿Superado? |
    |---|---|---|---|
    | 1. Foso Competitivo y Riesgo Terminal | X.X | 2.0 | SÍ/NO |
    | 2. Crecimiento Ventas y FCF/Acción | X.X | 2.0 | SÍ/NO |
    | 3. ROIC y Eficiencia del Capital | X.X | 2.0 | SÍ/NO |
    | 4. Solvencia y Liquidez | X.X | 2.0 | SÍ/NO |
    | 5. Capital Allocation y Gobernanza | X.X | 2.0 | SÍ/NO |
    | **CALIDAD TOTAL** | **X.XX** | **10.0** | **[Élite / Sólida / Insuficiente]** |

valuation_agent_task:
  description: |
    Hoy es {current_date}. Realiza las proyecciones financieras y el modelado de TIR para {target_name}.

    Sigue los pasos en orden estricto:
    1. Paso 1 — Busca las proyecciones de ingresos y FCF/BPA del consenso de Wall Street usando get_analyst_estimates y el guidance oficial de la empresa.
    2. Paso 2 — Evalúa los vientos de cola/cara y estresa los márgenes a futuro ante inflación o competencia sectorial.
    3. Paso 3 — Ejecuta la calculadora calculate_irr_scenarios TRES veces para obtener los tres escenarios de TIR (Pesimista, Base, Optimista).
    4. Determina la señal de inversión final y el Strike Price basándote en los retornos matemáticos calculados frente a los riesgos.

    5. Si existe el stress-test del abogado del diablo (abajo), el ESCENARIO PESIMISTA debe reflejar sus amenazas de probabilidad Media/Alta (crecimiento, márgenes o múltiplo que implican). Dilo en el escenario.

    Contexto cualitativo de la Fase 1 (Veredicto):
    {verdict_context}

    Stress-test del abogado del diablo:
    {destroyer_context}

    CONTEXTO DE AUDITORÍA CRÍTICA (Paso 0):
    {audit_context}

    {methodology}

  expected_output: |
    # 📊 PROYECCIONES FINANCIERAS Y MODELADO DE TIR — {target_name}
    > Análisis de Valoración a fecha {current_date}

    ## 🔮 1. PROYECCIONES FUTURAS (CONSENSO Y GUIDANCE)
    - **Consenso de Wall Street (CAGR 3-5 años):** [Expectativas de crecimiento en ingresos y beneficios]
    - **Guidance de la Directiva:** [Previsiones dadas por la empresa]
    - **Viento de Cola y Viento de Cara:** [Riesgos y catalizadores sectoriales macro que afectan las proyecciones]
    - **Stress Test de Márgenes:** [¿Podrán defender los márgenes ante inflación o competencia?]

    ## 🧮 2. ESCENARIOS Y RESULTADOS DE TIR (A 5 años)
    
    ### 🔴 ESCENARIO PESIMISTA (Bear Case)
    - *Crecimiento:* X% | *Múltiplo de Salida:* Xx
    - *TIR Calculada:* X%
    - *Amenaza que recoge:* [Si hay stress-test, cuál de sus amenazas y cómo se traduce en los supuestos]

    ### ⚖️ ESCENARIO BASE (Consenso / Realista)
    - *Crecimiento:* X% | *Múltiplo de Salida:* Xx
    - *TIR Calculada:* X%
    
    **Proyección Año a Año (Escenario Base):**
    | Año | Crecimiento | Valor Total | Valor por Acción | Dividendo Acum. |
    |-----|-------------|-------------|------------------|-----------------|
    | 0   | N/A         | $X          | $X               | $0.00           |
    | 1   | X%          | $X          | $X               | $X              |
    | ... | ...         | ...         | ...              | ...             |
    | 5   | X%          | $X          | $X               | $X              |

    ### 🟢 ESCENARIO OPTIMISTA (Bull Case)
    - *Crecimiento:* X% | *Múltiplo de Salida:* Xx
    - *TIR Calculada:* X%

    ---
    ## 🎯 PRECIO DE ENTRADA OBJETIVO (STRIKE PRICE)
    **Para obtener un 20% de TIR anualizado asumiendo el ESCENARIO BASE:**
    - **Strike Price (Precio Máximo de Compra):** $X
    - **Distancia al precio actual:** [ej. -30% o +15%]

    ---
    ## ⭐ SEÑAL DE VALORACIÓN: [STRONG BUY / BUY / HOLD / SELL / STRONG SELL]

    ## 📋 CONCLUSIÓN DE VALORACIÓN
    > Tres frases. ¿A los precios actuales el retorno asume un escenario perfecto o hay margen de seguridad?

