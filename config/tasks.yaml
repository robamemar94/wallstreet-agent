thesis_task:
  description: |
    Hoy es {current_date}. Como Socio de Inversiones y Gestor de Tesis, tu misión es formalizar el "Contrato de Inversión y Manual de Vigilancia" para {target_name}.
    Este informe se genera una vez que el Director de Inversiones ha emitido un Veredicto positivo, con el objetivo de deconstruir y entender el negocio profundamente para justificar nuestra inversión, establecer un plan de monitoreo trimestral cuantitativo y definir condiciones frías y objetivas de venta (Sell Triggers).

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Revisa y sintetiza minuciosamente los informes de los agentes anteriores para {target_name}:
       - Auditoría Financiera Forense: {audit_context}
       - Calidad de Franquicia y Moat: {franchise_context}
       - Dirección y Asignación de Capital: {mgmt_alloc_context}
       - Veredicto del Director de Inversiones: {verdict_context}
       - Escenarios de Valoración y TIR: {valuation_context}
    2. Si los informes anteriores muestran de manera contundente un descarte o una nota desastrosa que desaconseje invertir, tu informe debe redactar una "Tesis de No Inversión" o "Veredicto de Evitación", argumentando con hechos por qué se rechaza el activo. Pero si el activo es apto o el veredicto es positivo, procede con el manual de tesis, monitoreo y venta detallado.
    3. Investiga en internet (utilizando search_internet) para complementar y refinar los KPIs específicos del sector de {target_name} (ej: si es SaaS: LTV/CAC, Net Retention Rate; si es semiconductor: book-to-bill ratio, utilización de capacidad; si es retail: SSSG, etc.).
    4. Sigue de forma estricta las cuatro fases de la metodología para generar un informe de altísima calidad y rigor analítico.

    {methodology}

  expected_output: |
    # 📑 CONTRATO DE INVERSIÓN Y MANUAL DE VIGILANCIA — {target_name}
    > Documento de Convicción y Control de Riesgos a fecha {current_date}

    ## 🗺️ 1. MAPA COMPRENSIVO DEL NEGOCIO
    * **¿Cómo genera valor e ingresos?:** [Explicación clara del modelo de monetización y flujo de valor]
    * **Estructura de Costes y Palancas de Margen:** [Cuáles son los costes principales y cómo se escala la rentabilidad]
    * **Dinámica Sectorial y Posicionamiento:** [Dónde se sitúa la empresa en la cadena de valor de su industria]

    ## 💎 2. TESIS DE INVERSIÓN CORE (Nuestros Pilares de Convicción)
    * **Pilar 1: [Título del pilar, ej: Pricing Power secular en un nicho oligopolístico]**
      - *Evidencia empírica:* [Datos o conclusiones de los análisis de foso que sustentan este pilar]
    * **Pilar 2: [Título del pilar, ej: Máquina de capital allocation dirigida por directivos "Outsiders"]**
      - *Evidencia empírica:* [Datos de recompra de acciones eficientes, ROIC con Goodwill > 20%, o alta alineación accionarial]
    * **Pilar 3: [Título del pilar, ej: Opcionalidad y escalabilidad operativa del software core]**
      - *Evidencia empírica:* [Apalancamiento operativo demostrado o crecimiento de ingresos CAGR proyectado > 12%]

    ## 📊 3. CUADRO DE MANDO DE MONITORIZACIÓN (KPIs Clave a seguir)
    | Métrica / KPI Operativo | Frecuencia | Rango Objetivo / Saludable | Justificación / Por qué importa |
    |-------------------------|------------|----------------------------|---------------------------------|
    | [Métrica 1, ej: Margen FCF] | Trimestral | > XX% | Asegura que la conversión de caja no se deteriora |
    | [Métrica 2, ej: NRR / SSSG] | Trimestral/Anual | > XX% | Indica la fidelidad del cliente y crecimiento orgánico |
    | [Métrica 3, ej: Capex / Ventas] | Anual | < XX% | Controla la intensidad de capital y retorno incremental |
    | [Métrica 4, ej: Net Debt / EBITDA] | Semestral | < X.Xx | Asegura el control de la solvencia |

    ## 🛑 4. DISPARADORES DE VENTA (Motivos de Venta por Tesis Rota)
    > Estas son nuestras líneas rojas inquebrantables. Si se cruza cualquiera de estas condiciones operativas o estructurales, la tesis de inversión se considerará rota y procederemos a la liquidación de la posición de forma disciplinada.

    ### A. Deterioro del Negocio y Pérdida de Moat (Ventaja Competitiva)
    1. **[Condición específica 1, ej: El margen bruto consolidado disminuye por debajo del XX% durante 3 trimestres consecutivos]**
       - *Por qué rompe la tesis:* [Ej: Demostraría que el pricing power se ha perdido ante la competencia o inflación de costes]
    2. **[Condición específica 2, ej: Pérdida o rescisión de contrato con cualquier cliente clave que suponga >10% de la facturación]**

    ### B. Destrucción de Capital o Desviación Financiera
    1. **[Condición específica 1, ej: Ejecución de una adquisición (M&A) de gran tamaño (>20% de capitalización) fuera de su core business]**
       - *Por qué rompe la tesis:* [Ej: Señala un giro hacia crecimiento ineficiente y alto riesgo de integración]
    2. **[Condición específica 2, ej: Aumento del ratio Deuda Neta/EBITDA por encima de X.Xx, a menos que esté justificado por una adquisición muy específica con plan de desapalancamiento rápido]**

    ### C. Alineación, Gobernanza y Directiva
    1. **[Condición específica 1, ej: Salida imprevista del CEO o CFO fundador bajo circunstancias opacas o sospechas contables]**
       - *Por qué rompe la tesis:* [Ej: Rompe la confianza depositada en la alineación y la cultura de "outsider"]
    2. **[Condición específica 2, ej: Emisión de nuevas acciones o SBC que diluya a los accionistas existentes a un ritmo neto superior al X% anual sin estar compensado por recompras mayores]**

technical_analysis_task:
  description: |
    # CONTEXTO Y ROL
    Actúa como un Analista Técnico y Estratega de Inversiones Senior, especializado en "Buy the Dip" y Reversión a la Media. Tu objetivo es evaluar la cotización de **{target_name}** a fecha de **{current_date}** y emitir un veredicto de entrada inteligente, equilibrado y realista.

    # ⚙️ ORDEN DE EJECUCIÓN
    **1. Obtención de Datos Técnicos:** Antes de empezar, utiliza de forma obligatoria la herramienta `get_technical_analysis_data` para extraer las métricas de precio, volumen, RSI, divergencias, MACD, Bandas de Bollinger, soportes históricos, tendencia semanal y patrón de vela más recientes de **{ticker}**.
    **2. Investigación del Catalizador:** Utiliza la herramienta `search_internet` para averiguar la causa real y reciente del movimiento de precio (noticia, resultados, cambio de guidance, situación sectorial, etc.). No asumas ni inventes el motivo de la caída o subida sin buscarlo.
    **3. Análisis y Veredicto:** Procede a realizar tu análisis siguiendo tu filosofía y modelo de decisión. Basa cada afirmación técnica exclusivamente en los datos devueltos por `get_technical_analysis_data`, y el diagnóstico del catalizador en lo encontrado con `search_internet`. Si un campo técnico vuelve como "N/A" o sin señal detectada, dilo explícitamente en vez de inventar una lectura de gráfico que no tienes.

    ---

    # 🧠 FILOSOFÍA DE ANÁLISIS Y MODELO DE DECISIÓN

    Tu verdadero valor no reside en aplicar reglas de forma mecánica, sino en **sopesar el balance de riesgos y oportunidades** para tomar una decisión clínica. Utiliza los siguientes pilares para guiar tu juicio:

    **1. DIAGNÓSTICO DEL CATALIZADOR:** Con base en lo encontrado vía `search_internet`, ¿la caída es una **Oportunidad Táctica/Temporal** o un **Riesgo Estructural Serio**?

    **2. FILTRO DE CALIDAD DEL ACTIVO (MOAT):** ¿La empresa sigue siendo un negocio sólido que justifica comprar en la debilidad?

    **3. INTERPRETACIÓN DEL ESCENARIO TÉCNICO:** ¿Estamos en una **Configuración A (Pánico con potencial de rebote)** o en una **Configuración B (Giro ya confirmado)**?

    **4. MODELO DE PONDERACIÓN DE RIESGO (Tu Veredicto Clínico):**
    En lugar de líneas rojas inquebrantables, evalúa los siguientes factores.

    *   **Factores de Alto Riesgo (Agravantes):**
        *   **Tendencia Primaria Rota:** El precio está por debajo de la SMA 200. Esto exige una razón de peso para comprar.
        *   **"Cuchillo Cayendo":** El precio está en caída vertical sin signos de soporte. Esto sugiere esperar.
        *   **RSI Neutro o Alto:** No hay sobreventa que justifique una entrada inminente por reversión a la media.

    *   **Factores de Convicción (Atenuantes):**
        *   **Calidad Excepcional del Negocio:** La empresa es una fortaleza con un Moat ancho o muy fuerte.
        *   **Pánico Extremo:** El RSI está en sobreventa clara (<35) o muestra divergencias alcistas.
        *   **Catalizador Temporal:** La razón de la caída es claramente temporal y no estructural.
        *   **Nivel de Soporte Histórico:** El precio se acerca a uno de los soportes históricos reales reportados por la herramienta o a un nivel psicológico clave.
    **Tu tarea es justificar tu veredicto final explicando cómo sopesas estos factores.** Por ejemplo, un activo bajo la SMA 200 (factor de riesgo) podría ser una compra si la calidad es excepcional y está en un soporte histórico clave con RSI de 30 (factores de convicción).
  expected_output: |
    # 📉 ANÁLISIS TÉCNICO Y ESTRATEGIA DE ENTRADA — {target_name}

    ## 1. Matriz de Decisión y Puntuación Clínica
    | Componente | Clasificación | Justificación Breve |
    | :--- | :--- | :--- |
    | **Momentum (RSI/MACD/Bollinger)** | `[Compra Fuerte/Compra/Neutral/Venta]` | `[Nivel, divergencia y lectura MACD/Bollinger]` |
    | **Estructura (SMA/Soportes/Semanal)**| `[Compra Fuerte/Compra/Neutral/Venta]` | `[Proximidad a soporte real y tendencia semanal]` |
    | **Price Action (Vela/Volumen)** | `[Compra Fuerte/Compra/Neutral/Venta]` | `[Patrón de vela y lectura de volumen, si los hay]` |
    | **PUNTUACIÓN "CLÍNICA"** | **[Nota de 1 a 10]** | **[Frase que justifica la nota global]** |

    *   **Veredicto Definitivo:** **[🟢 COMPRAR YA / 🟡 ESPERAR Y OBSERVAR / 🔴 DESCARTAR]**
    *   **Sesgo (obligatorio si el veredicto es ESPERAR Y OBSERVAR):** **[ALCISTA / NEUTRAL / BAJISTA]** — nunca dejes un "ESPERAR" sin matizar hacia qué lado se inclina la balanza ahora mismo.
    *   **Gatillo de Reevaluación (obligatorio si el veredicto es ESPERAR Y OBSERVAR):** [Condición técnica exacta y verificable que convertiría este ESPERAR en COMPRAR YA, ej: "RSI cierra por debajo de 30" o "el precio toca el soporte de $105 con vela de rechazo"]. Indica también la **Distancia Actual** a ese gatillo en % desde el precio de hoy (ej: "-4.2% hasta zona de compra"). Prohibido escribir un gatillo genérico tipo "esperar más confirmación" sin nivel ni indicador concreto.

    ## 2. Diagnóstico del Dip y Veredicto de Calidad
    *   **Catalizador de la Caída:** [Análisis del porqué de la caída y clasificación].
    *   **Veredicto de Calidad del Activo:** [¿Merece el negocio que compremos sus problemas a corto plazo? SÍ/NO y por qué].

    ## 3. Escenario Técnico y Flujo de Volumen
    *   **Soportes y Estructura (SMA/Soportes Históricos/Tendencia Semanal):** [Proximidad del precio a los soportes históricos reales y a las SMA 50/200; estado de la tendencia semanal].
    *   **Momentum (RSI/Divergencia/MACD/Bollinger):** [Nivel de RSI, resultado del campo de divergencia, lectura de MACD y posición en Bandas de Bollinger].
    *   **Volumen y Patrón de Vela:** [Lectura del campo de volumen (capitulación/acumulación/sin señal) y del patrón de vela detectado, si lo hay].
    *   **Fase del Dip:** [Clasificación: Configuración A (Pánico) o B (Confirmación)].

    ## 4. Justificación del Veredicto y Estrategia de Acumulación
    *   **Justificación del Veredicto:** [Párrafo explicando cómo se han sopesado los Factores de Alto Riesgo y los Factores de Convicción para llegar a la conclusión final. Explica tu razonamiento clínico].
    *   **Plan de Acumulación Táctico:**
        *   **Entrada Inicial:** `[Precio/Rango ideal para la primera compra]`
        *   **Zona de Recompra (DCA):** `[Siguiente nivel de soporte estructural para una segunda compra si la caída continúa]`
        *   **Nivel de Invalidación:** `[Precio por debajo del cual la tesis técnica quedaría invalidada y se debería pausar la acumulación]`

thesis_destroyer_task:
  description: |
    Hoy es {current_date}. Como Socio Destructor de Tesis de Inversión, tu misión es someter a un "stress-test" despiadado la tesis de inversión para {target_name}.

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Analiza con escepticismo extremo toda la información acumulada sobre {target_name}:
       - Auditoría Financiera Forense: {audit_context}
       - Calidad de Franquicia y Moat: {franchise_context}
       - Dirección y Asignación de Capital: {mgmt_alloc_context}
       - Veredicto de Inversión: {verdict_context}
       - Tesis de Inversión Alcista (si existe): {rules_context}
    2. Identifica y desarrolla las 3 tesis bajistas (Bear Cases) o amenazas estructurales más críticas que podrían destruir o desintegrar este negocio en los próximos 10 años (ej: obsolsecencia por software/IA, pérdida irreversible de pricing power, irrupción de competidores de bajo coste, degradación de márgenes operativos, apalancamiento financiero peligroso, etc.).
    3. Para cada una de las 3 tesis destructivas identificadas:
       - Explica en detalle el mecanismo económico o estratégico de cómo ocurriría la destrucción del negocio paso a paso.
       - Evalúa la **probabilidad real de ocurrencia** (Baja / Media / Alta) basándote en la resiliencia operativa real de la empresa y la ciclicidad histórica del sector.
       - Identifica qué **factores de protección o barreras (Moat, contramedidas del management, flexibilidad de costes)** impiden actualmente que esta amenaza se materialice.
    4. Adopta un tono de "Abogado del Diablo" sumamente riguroso y frío. Evita el pánico innecesario; cada amenaza debe estar sólidamente fundamentada en la realidad económica del sector.
    5. Para el bloque final XML de <resumen> exigido por las instrucciones del sistema:
       - En <score> debes indicar la puntuación de inmunidad del negocio a la destrucción (0.0 a 10.0, donde 10.0 significa un negocio prácticamente indestructible con bajísima probabilidad de amenazas reales, y 0.0 significa un negocio altamente vulnerable).
       - En <pros> debes listar en elementos <item> los factores de inmunidad o mitigación más fuertes del negocio.
       - En <cons> debes listar en elementos <item> los riesgos destructivos más probables o peligrosos.

    ════════════════════════════════════════════
    NORMAS DE CALIDAD DEL USUARIO
    ════════════════════════════════════════════
    {custom_evaluation_rules}

    {methodology}

  expected_output: |
    # INFORME DE DESTRUCCIÓN DE TESIS (STRESS-TEST) — {target_name}
    > Análisis de Robustez frente a Amenazas Estructurales a fecha {current_date}

    ## 💀 VEREDICTO DEL ABOGADO DEL DIABLO
    * **Puntuación de Inmunidad:** X.X / 10.0 Puntos (Inmunidad al fracaso)
    * **Nivel de Vulnerabilidad:** [Bajo / Moderado / Alto / Crítico]

    ---
    ## ⚡ TESIS DESTRUCTIVAS DE INVERSIÓN (BEAR CASES)

    ### 1. [Nombre de la Amenaza 1]
    * **Mecanismo de Destrucción:** [Cómo el negocio se desintegra paso a paso en el mercado]
    * **Probabilidad Real de Ocurrencia:** [Baja / Media / Alta] - [Justificación fundamentada]
    * **Factores de Mitigación / Barreras de Defensa:** [Qué foso o escudo protege a la compañía hoy de esto]

    ### 2. [Nombre de la Amenaza 2]
    ...

    ### 3. [Nombre de la Amenaza 3]
    ...

    ---
    ## 🛡️ MATRIZ DE ROBUSTEZ Y SINOPSIS CRÍTICA
    > Conclusión sobre si las amenazas son riesgos estructurales inevitables a largo plazo o si el foso de la empresa es lo suficientemente robusto para contenerlas.
