  description: |
    Hoy es {current_date}. Como Auditor de Normas de Calidad, debes evaluar de forma rigurosa, exigente pero siempre justa y razonable el **Pilar 5: Asignación de Capital, ROIIC, Recompra, SBC y Gobernanza** para {target_name}.

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Utiliza el contexto financiero real disponible en `{audit_context}`. Analiza el historial completo disponible (últimos 10 años).
