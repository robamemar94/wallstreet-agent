pe_forensic_task:
  description: |
    Hoy es {current_date}. Como Socio de Private Equity y Auditoría Forense, realiza un análisis de ingeniería inversa de los tres estados financieros para deconstruir el modelo de negocio de {target_name}.

    ORDEN DE EJECUCIÓN OBLIGATORIO:
    1. Utiliza el CONTEXTO DE AUDITORÍA (más abajo): la síntesis de la auditoría forense, las tres cuentas y los ratios forenses ya calculados en Python. Usa esos ratios; no los recalcules.
    2. Si no hay cuentas en el contexto, no inventes cifras: indícalo en la Declaración Previa de Supuestos y pide que se carguen en la pestaña de Auditoría.
    3. Sigue estrictamente las 4 fases de la metodología.
    4. NO repitas la auditoría forense: tu valor es la reconciliación entre estados y la mirada de dueño (owner earnings). Si discrepas de la síntesis forense en algo material, dilo explícitamente en la Fase 4.

    CONTEXTO DE AUDITORÍA CRÍTICA (Paso 0):
    {audit_context}

    {methodology}
  expected_output: |
    # 🕵️‍♂️ INGENIERÍA INVERSA Y CALIDAD DE BENEFICIOS (PE/VC) — {target_name}
