# Transcrito de data/theses/UBER_Tesis_Inversion_Definitiva_v1.md (02/10/2026)
# El documento venía de pandoc: config/theses/uber.md es la misma tesis con las tablas pasadas a Markdown normal,
# sin los escapes (\$, \~) y con el estado «STRENGTHENING» (11) como texto en negrita (no es un apartado).
# Cuadro de mando: los 9 KPIs del «Dashboard KPI definitivo» (7) agrupados por hipótesis (6, H1–H9), con sus umbrales;
# los «Thesis Killers» (13) van como kill switches de su KPI (1 y 9, densidad y regulación, en un paso propio; el 10,
# deterioro simultáneo, es una regla). STRENGTHENING de la tesis = REFORZADA en la app.
# Regla de la tesis: un KPI rojo aislado no rompe la tesis; se busca convergencia de señales. FCF/share es el KPI
# financiero final y pesa más. Las preguntas maestras salen de 12 (WATCH / WEAKENING / BROKEN), 14 (checklist) y 15.
# Donde la tesis no da cifra actual (EBITDA/GB en pb, FCF/share YoY, share count) no hay observación inicial.
ticker: UBER
title: Uber · Tesis de inversión
version: "Framework v3.2 · Tesis v1"
reference_date: "2026-10-02"
reference_price: 67.6
source_document: "data/theses/UBER_Tesis_Inversion_Definitiva_v1.md"
document: config/theses/uber.md
verdict: REFORZADA
summary: >-
  Infraestructura global de movilidad y comercio bajo demanda: densidad local, efectos de red, escala, marca, datos y
  ecosistema (switching costs bajos). Q2 2026: MAPCs 208M (+16%), Trips +18%, Trips/MAPC +2%, Gross Bookings $58,0B
  (+22% CC; Mobility +20%, Delivery ~+25%), Adjusted EBITDA +33%, Non-GAAP Operating Income +40% y FCF TTM >$10B.
  Delivery ya es un segundo motor; Delivery Hero (€41,50/acción) está en WATCH hasta demostrar ROIC/FCF incremental y la
  autonomía (AV) es opcionalidad fuera del caso base. Estado: STRENGTHENING (la cadena económica completa funciona).
hypothesis: "Uber evoluciona de ride-hailing a infraestructura global de demanda y oferta bajo demanda: consumidores ↑ → densidad ↑ → frecuencia ↑ → Trips ↑ → Gross Bookings ↑ → operating leverage ↑ → FCF ↑ → FCF/share ↑. Sigue intacta mientras el marketplace crezca, el engagement se mantenga, el operating leverage continúe, el FCF/share crezca aproximadamente a doble dígito y el capital allocation no destruya ese valor. El caso base no necesita AV."
hypotheses:
  H1: "Crecimiento de consumidores (MAPCs +10–12% anual)"
  H2: "Engagement (Trips/MAPC +2–4%)"
  H3: "Crecimiento del marketplace (Gross Bookings +15–20% CC)"
  H4: "Operating leverage (expansión gradual de EBITDA/GB)"
  H5: "Delivery como segundo motor (Delivery GB +15–20% CC)"
  H6: "Crecimiento del valor por acción (FCF/share +8–12% anual)"
  H7: "Las recompras superan la dilución (reducción neta ~1–3% anual)"
  H8: "Delivery Hero crea valor (WATCH)"
  H9: "Uber mantiene la capa de distribución AV"
rules:
  - "Los semáforos son herramientas de investigación: un KPI rojo aislado no rompe la tesis; se busca convergencia de señales."
  - "FCF/share es la métrica financiera final: crecer Gross Bookings no basta si no genera valor por acción."
  - "WATCH: un mecanismo empieza a deteriorarse sin evidencia de cambio estructural (p. ej. MAPCs a ~8–10% con GB y FCF sólidos). WEAKENING: convergen varias señales negativas (menos usuarios, frecuencia negativa, GB <10%, margen estancado o bajando). BROKEN: el mecanismo económico central ya no funciona (pérdida de densidad/moat, desintermediación AV, FCF/share estructuralmente bajo o asignación de capital destructiva)."
  - "Thesis Killer 10: deterioro simultáneo de usuarios + frecuencia + margen + FCF/share."
  - "Las recompras no son creación de valor automática: el KPI es la reducción neta de acciones después de SBC. Delivery Hero no se considera creadora de valor por defecto."
  - "No usar el beneficio neto sin normalizar (Q2 2026 incluye ~$1,6B pre-tax de revalorización de inversiones): EBITDA y beneficio contable son secundarios frente al FCF normalizado."
  - "No asumir que el margen deba expandirse indefinidamente. El caso base no incluye valor significativo de AV, crecimiento extraordinario indefinido de Delivery, múltiplos extremos ni sinergias máximas de Delivery Hero."
  - "No actualizar la tesis porque la acción suba o baje, sino cuando cambie la evidencia económica: evento → cambio observado → hipótesis afectada → KPI/señal → mecanismo económico → valoración → estado de tesis → siguiente watchpoint."
  - "Los umbrales son parámetros propios de seguimiento, no guidance de Uber: revisarlos si cambia estructuralmente la economía del negocio."
master_questions:
  - "¿Siguen creciendo los MAPCs por encima del 12% y la frecuencia (Trips/MAPC) por encima del 2%?"
  - "¿Mantienen Gross Bookings y Delivery un crecimiento ≥15% CC?"
  - "¿Se sigue expandiendo el margen EBITDA/Gross Bookings?"
  - "¿Crece el FCF/share ≥10% y baja el número neto de acciones después de SBC?"
  - "¿Demuestra Delivery Hero ROIC incremental, sinergias y FCF/share?"
  - "¿Captura Uber la distribución de los operadores AV o la controlan ellos directamente?"
  - "¿Hay convergencia de señales negativas (usuarios, frecuencia, margen, FCF/share) o solo un KPI aislado?"
  - "¿Qué evidencia nueva favorece el Bull case?"
  - "¿Qué evidencia nueva favorece el Bear case?"
valuation:
  target_year: 2031
  question: "FCF/share × múltiplo terminal de FCF. Precio ~$67,6, FCF TTM ~$10,1B y ~2,04B acciones → FCF/share ≈ $4,95, P/FCF ≈ 13,7x, FCF yield ≈ 7,3%. Escenarios de sensibilidad a 5 años, no predicciones."
  columns:
    - {key: name, label: Escenario}
    - {key: fcf_ps_cagr, label: FCF/share CAGR, format: pct}
    - {key: multiple, label: Múltiplo terminal}
    - {key: price, label: Precio 2031, format: usd}
    - {key: cagr_doc, label: CAGR 5a (tesis), format: pct}
    - {key: note, label: Interpretación}
  scenarios:
    - {name: Bear, fcf_ps_cagr: 7, multiple: "18x", price: 119, cagr_doc: 12, note: "Operating leverage limitado, Delivery desacelera, AV aporta poca economía"}
    - {name: Base, fcf_ps_cagr: 10, multiple: "20x", price: 160, cagr_doc: 19, note: "GB a doble dígito alto, margen se expande gradualmente, recompras reducen acciones, sinergias razonables de Delivery Hero, sin AV"}
    - {name: Bull, fcf_ps_cagr: 13, multiple: "22x", price: 190, cagr_doc: 23, note: "Crecimiento superior más tiempo, fuerte operating leverage y cross-selling, sinergias importantes y AV con economics relevantes"}
