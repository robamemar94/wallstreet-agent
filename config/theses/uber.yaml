  - date: "2026-10-02"
    type: thesis
    impact: positive
    title: "Tesis v1 (framework v3.2) · estado STRENGTHENING"
    body: "La cadena económica completa funciona: usuarios, frecuencia, Gross Bookings, Delivery, EBITDA, Operating Income, FCF y reducción de acciones. Moat Durability Score 82/100. Oferta por Delivery Hero (€41,50/acción, equity ~$14,8B) en WATCH hasta demostrar ROIC/FCF incremental. Precio de referencia ~$67,6."

pillars:
  - key: consumers
    name: Consumidores
    description: "H1 — ¿Crece la base? Objetivo MAPCs +10–12% anual a medio plazo. Falsificación: estancamiento persistente sin compensación por frecuencia o monetización."
    kpis:
      - {key: mapcs_growth, name: MAPCs YoY, unit: "%", green_threshold: 12, red_threshold: 7,
         how_to_measure: "Crecimiento interanual de los consumidores activos mensuales (MAPCs)",
         green_text: "≥12%", amber_text: "7–12%", red_text: "<7% de forma persistente",
         frequency: Trimestral, source: Uber,
         is_kill_switch: true, kill_rule: "Killer 2: MAPCs y frecuencia estancados durante varios años",
         observations: [{period: Q2 2026, date: "2026-06-30", value: 16, note: "208M MAPCs, +16%"}]}

  - key: engagement
    name: Engagement
    description: "H2 — ¿Aumenta la frecuencia? Objetivo Trips/MAPC +2–4%."
    kpis:
      - {key: trips_per_mapc, name: Trips/MAPC YoY, unit: "%", green_threshold: 2, red_threshold: 0,
         how_to_measure: "Crecimiento interanual de los viajes/servicios por consumidor activo mensual",
         green_text: "≥2%", amber_text: "0–2%", red_text: "<0% persistente",
         frequency: Trimestral, source: Uber,
         observations: [{period: Q2 2026, date: "2026-06-30", value: 2, note: "Trips 3,867B (+18%); Trips/MAPC +2%"}]}

  - key: marketplace
    name: Marketplace
    description: "H3 — ¿Crece el marketplace? Objetivo Gross Bookings +15–20% CC."
    kpis:
      - {key: gross_bookings_cc, name: Gross Bookings YoY (CC), unit: "%", green_threshold: 15, red_threshold: 10,
         how_to_measure: "Crecimiento interanual de Gross Bookings a divisa constante",
         green_text: "≥15%", amber_text: "10–15%", red_text: "<10% persistente",
         frequency: Trimestral, source: Uber,
         is_kill_switch: true, kill_rule: "Killer 3: Gross Bookings <10% de forma estructural",
         observations: [{period: Q2 2026, date: "2026-06-30", value: 22, note: "$58,0B, +22% CC"}]}

  - key: operating_leverage
    name: Operating leverage
    description: "H4 — ¿Hay leverage? Expansión gradual del margen Adjusted EBITDA / Gross Bookings (~4,9% en Q2 2026). No se asume que deba expandirse indefinidamente."
    kpis:
      - {key: ebitda_gb_change, name: Cambio del margen EBITDA/GB YoY, unit: "pb", green_threshold: 20, red_threshold: -20,
         how_to_measure: "Variación anual del margen Adjusted EBITDA / Gross Bookings, en puntos básicos",
         green_text: "+20 pb o más al año", amber_text: "0–20 pb", red_text: "Contracción >20 pb/año persistente",
         baseline: "Margen EBITDA/GB ~4,9% en Q2 2026 (EBITDA +33% frente a GB +22%)", frequency: Trimestral, source: Uber / cálculo propio,
         is_kill_switch: true, kill_rule: "Killer 4: el operating leverage desaparece permanentemente"}

  - key: delivery
    name: Delivery
    description: "H5 — ¿Crece el segundo motor? Objetivo Delivery GB +15–20% CC."
    kpis:
      - {key: delivery_gb_cc, name: Delivery Gross Bookings YoY (CC), unit: "%", green_threshold: 15, red_threshold: 10,
         how_to_measure: "Crecimiento interanual de los Gross Bookings de Delivery a divisa constante",
         green_text: "≥15%", amber_text: "10–15%", red_text: "<10% persistente",
         frequency: Trimestral, source: Uber,
         observations: [{period: Q2 2026, date: "2026-06-30", value: 25, note: "~$27,5B, ~+25% CC (Mobility ~$29,0B, +20% CC)"}]}
      - {key: uber_one_cross_sell, name: Uber One / cross-sell, kind: qualitative,
         how_to_measure: "Socios de Uber One, penetración cross-platform (Mobility + Delivery), publicidad y grocery/retail: ¿aumenta el valor por usuario?",
         green_text: "Mejora (↑)", amber_text: "Estable (→)", red_text: "Empeora (↓)",
         frequency: Trimestral, source: Uber,
         observations: [{period: Q2 2026, date: "2026-06-30", status: green, note: "Tendencia positiva"}]}

  - key: fcf_share
    name: FCF por acción
    weight: 2
    description: "H6 — ¿Llega al accionista? FCF/share es el KPI financiero final de la tesis. Objetivo +8–12% anual; FCF/share TTM ≈ $4,95."
    kpis:
      - {key: fcf_per_share, name: FCF por acción YoY, unit: "%", green_threshold: 10, red_threshold: 5,
         how_to_measure: "Crecimiento del FCF por acción (autocompletado); FCF 2025 ~$9,76B, TTM Q2 2026 >$10B",
         green_text: "≥10%", amber_text: "5–10%", red_text: "<5% persistente",
         baseline: "FCF/share TTM ≈ $4,95 (FCF ~$10,1B / ~2,04B acciones)", frequency: Trimestral, source: yfinance, auto_metric: fcf_per_share_yoy,
         is_kill_switch: true, kill_rule: "Killer 5: FCF/share <5% durante varios años"}

  - key: share_count
    name: Recompras vs dilución
    description: "H7 — ¿Está controlado el SBC? Objetivo: reducción neta de acciones ~1–3% anual después de SBC. H1 2026: ~46,6M acciones recompradas por ~$3,5B."
    kpis:
      - {key: net_share_count, name: Acciones diluidas YoY, unit: "%", direction: lower, green_threshold: -1, red_threshold: 1,
         how_to_measure: "Variación interanual de las acciones diluidas (autocompletado)",
         green_text: "Reducción ≥1%", amber_text: "−1% a +1%", red_text: "Crecimiento neto >1%",
         baseline: "Bajando (↓) en Q2 2026", frequency: Trimestral, source: yfinance, auto_metric: diluted_shares_yoy,
         is_kill_switch: true, kill_rule: "Killer 6: dilución neta persistente pese a recompras"}

  - key: delivery_hero
    name: Delivery Hero
    description: "H8 — Oferta de €41,50/acción (equity ~$14,8B; ~$13,7B ajustado por compras previas): 99 mercados y ~$236B de Gross Bookings pro forma 2025. WATCH hasta demostrar ROIC/FCF incremental."
    kpis:
      - {key: delivery_hero_roic, name: ROIC / FCF incremental de Delivery Hero, kind: qualitative,
         how_to_measure: "ROIC incremental, sinergias, FCF incremental y FCF/share tras la integración; balance",
         green_text: "ROIC incremental atractivo, sinergias y FCF incremental", amber_text: "Sin evidencia todavía (WATCH)", red_text: "Crecimiento sin mejora de FCF, retorno bajo sobre capital o deterioro material del balance",
         frequency: Trimestral, source: Uber,
         is_kill_switch: true, kill_rule: "Killer 7: Delivery Hero destruye ROIC/FCF",
         observations: [{period: Q2 2026, date: "2026-10-02", status: amber, note: "WATCH hasta demostrar ROIC/FCF incremental"}]}

  - key: autonomy
    name: Autonomía (AV)
    description: "H9 — ¿Uber captura la distribución? Opcionalidad fuera del caso base: capa de demanda de múltiples operadores autónomos frente al riesgo de desintermediación."
    kpis:
      - {key: av_distribution, name: Distribución AV, kind: qualitative,
         how_to_measure: "Operadores integrados, ciudades, AV trips, economics y quién es dueño de la relación con el consumidor",
         green_text: "Avance claro: más operadores, ciudades, trips y economics positivos", amber_text: "Incierto", red_text: "Desintermediación: los operadores AV controlan consumidor y economics",
         frequency: Trimestral, source: Uber / sector,
         is_kill_switch: true, kill_rule: "Killer 8: AV desintermedia Uber",
         observations: [{period: Q2 2026, date: "2026-10-02", status: amber, note: "Fase inicial"}]}

  - key: moat
    name: Densidad y regulación
    description: "Moat Durability Score 82/100: efectos de red locales y densidad, con switching costs bajos, competencia (Lyft, Bolt, DiDi, DoorDash, Waymo…) y regulación estructurales."
    kpis:
      - {key: density, name: Densidad frente a competidores, kind: qualitative,
         how_to_measure: "Consumidores, conductores/repartidores activos, merchants y pricing frente a competidores en cada mercado",
         green_text: "Densidad y cuota se mantienen o mejoran", amber_text: "Presión competitiva en algunos mercados", red_text: "Pérdida estructural de densidad",
         frequency: Trimestral, source: Uber / sector,
         is_kill_switch: true, kill_rule: "Killer 1: pérdida estructural de densidad frente a competidores"}
      - {key: regulation, name: Regulación, kind: qualitative,
         how_to_measure: "Legislación y litigios (estatus de conductores, seguros, restricciones) y su efecto en costes por viaje",
         green_text: "Sin impacto material", amber_text: "Mayores costes o restricciones acotadas", red_text: "Reduce materialmente los economics",
         frequency: Trimestral, source: Uber / prensa,
         is_kill_switch: true, kill_rule: "Killer 9: la regulación reduce materialmente los economics"}
