pillars:
  - key: organic
    name: Organic services growth
    description: "H3 — ¿Los servicios orgánicos siguen ≥8%? Si no, ¿por qué (ciclo, inversión, competencia)?"
    kpis:
      - {key: organic_services_growth, name: Organic services growth, unit: "%", green_threshold: 8, red_threshold: 5,
         how_to_measure: "Crecimiento de services sin M&A (DSGX no da la descomposición completa: anotar cómo se estima)",
         green_text: "≥8%", amber_text: "5–8%", red_text: "<5% persistente y no explicado por ciclo/inversión",
         frequency: Trimestral, source: Descartes,
         is_kill_switch: true, kill_rule: "Breaker 1: organic services growth <5% sin explicación cíclica (y breaker 7: M&A necesario para ocultar deterioro orgánico)"}

  - key: services
    name: Services revenue %
    description: "Recurrencia: suscripción, transacciones y soluciones recurrentes (~94% en H1 FY27)."
    kpis:
      - {key: services_pct, name: Services revenue %, unit: "%", green_threshold: 90,
         how_to_measure: "Calidad / recurrencia", green_text: ">90%", amber_text: "<90%", red_text: "Caída estructural",
         frequency: Trimestral, source: Descartes,
         observations: [{period: FY26, date: "2026-01-31", value: 93},
                        {period: Q2 FY27, date: "2026-07-31", value: 94}]}

  - key: gross_margin
    name: Gross margin
    description: "H4 — Economía del software: objetivo >75% (78% en H1 FY27)."
