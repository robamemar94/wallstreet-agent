# Transcrito de data/theses/DSGX_Tesis_Maestra_Definitiva_v3.2.md (Framework v3.2, revisión 06/10/2026).
# Sustituye a la «Tesis definitiva» del 24/09/2026 (PDF), guardada en config/theses/history/.
# config/theses/dsgx.md es el mismo documento sin las marcas de cita; al final, los enlaces de la tesis anterior.
# Cuadro de mando: solo los KPIs CUANTIFICABLES del «14. Dashboard de 5 minutos» (las mismas claves que antes, para no
# perder lo ya registrado). Cross-sell, retención/pricing, posición competitiva, ROIC del M&A y economía de la IA no
# tienen cifra publicada: un semáforo a ojo pesaría en la puntuación igual que un dato y se quedaría viejo. Se revisan
# con las preguntas maestras y la regla de los thesis breakers. Cada pilar dice a qué hipótesis (7) responde.
# Kill switches: los «Thesis breakers» (10) que tienen KPI. Regla de la tesis: un único KPI rojo no rompe la tesis.
# Las preguntas maestras salen del apartado 8; la última, del sistema de actualización (13).
# Donde la tesis solo define el objetivo (sin umbral de alerta numérico), red_threshold se deja vacío:
# por debajo del objetivo el KPI queda en amarillo y el rojo se decide a mano.
# Reimportar tras editar:  python scripts/import_theses.py config/theses/dsgx.yaml
ticker: DSGX
title: Descartes Systems Group · Tesis Maestra
version: "Framework v3.2 · Tesis Maestra Definitiva"
reference_date: "2026-10-06"
reference_price: 80.50
source_document: data/theses/DSGX_Tesis_Maestra_Definitiva_v3.2.md
document: config/theses/dsgx.md
verdict: INTACTA
summary: >-
  Compounder de infraestructura logística / software vertical: red de conectividad (GLN) + software vertical + datos +
  procesos regulatorios + adquisiciones, cada vez más integrada en las operaciones de sus clientes. Moat compuesto
  (network + workflow + regulatory + distribution). Evidencia financiera muy fuerte (H1 FY27: revenue +13%, services
  +14% y 94% del total, CFO +34%, EBITDA ajustado 47%, caja $401M); lo no demostrado es la economía exacta del network
  effect, retención/NRR, pricing power y el ROIC de las adquisiciones recientes (TAI, Extensiv). Estado: INTACT 🟢/🟡.
  Valor razonable central ~$90–95.
hypothesis: "Si GLN + software + workflows + datos hacen que Descartes sea progresivamente más difícil de sustituir, puede mantener crecimiento orgánico de alta cifra simple, aumentar el valor por cliente, seguir haciendo adquisiciones razonables y convertir ese crecimiento en FCF por acción (~8–9% a largo plazo) durante muchos años: más conexiones → más utilidad → más workflows → más dependencia → más cross-sell → más datos → más automatización → más valor por cliente."
hypotheses:
  H1: "GLN se vuelve progresivamente más difícil de sustituir (🟢/🟡)"
  H2: "Los switching costs son económicamente relevantes (🟢/🟡; sin NRR/churn publicado)"
  H3: "Organic services growth ≥8% (🟢/🟡)"
  H4: "El crecimiento se convierte en FCF/share (🟢)"
  H5: "El M&A crea valor incremental (🟡, la principal hipótesis aún no demostrada)"
  H6: "La SBC permanece controlada (🟢/🟡)"
  H7: "La asignación de capital permanece racional (🟢/🟡)"
  H8: "La IA refuerza el moat (🟡)"
rules:
  - "La gran pregunta no es «¿DSGX sigue creciendo?» sino «¿DSGX se está haciendo cada vez más difícil de sustituir?». Si la respuesta empieza a ser no, bajar expectativas de crecimiento, múltiplo y CAGR aunque los resultados de corto plazo sigan siendo buenos."
  - "Management explica; los KPIs verifican. Network effect, cross-sell, IA, sinergias y oportunidades de mercado son hipótesis hasta que los números las confirman."
  - "Un único KPI rojo no rompe la tesis: analizar magnitud + duración + ciclo + inversión deliberada + mecanismo económico. Un trimestre malo no es un thesis breaker."
  - "No extrapolar +12–14% indefinidamente: la hipótesis central de largo plazo es ~8–9% de crecimiento del FCF/share."
  - "El M&A debe acelerar el compounder, no esconder una desaceleración orgánica: precio → crecimiento → margen → FCF → integración → cross-sell → ROIC. Una adquisición no crea valor solo porque encaje, sume revenue o tenga cross-sell potencial."
  - "Cross-sell ≠ NRR: no inventar una tasa de expansión que DSGX no publica. Mirar FCF/share después de SBC y cambios en acciones, no solo FCF total."
  - "La opcionalidad (IA, nuevos workflows, M&A, internacionalización) no entra en el caso base hasta que exista evidencia económica. IA: uso → ahorro/productividad → adopción → retención/cross-sell → margen/FCF."
  - "Actualización: resultado/evento → cambio observado → pregunta maestra → hipótesis → KPI → mecanismo económico → impacto en valoración → estado → siguiente punto a vigilar. Estados: INTACT (nada cambia la interpretación), STRENGTHENING, WATCH (señal ambigua), WEAKENING (se debilita una hipótesis importante), BROKEN (una condición necesaria deja de cumplirse estructuralmente)."
  - "Prioridades en cada resultado: 1) organic growth, 2) ROIC del M&A (TAI y Extensiv), 3) posición frente a CargoWise/project44/suites, 4) switching costs/retención, 5) FCF/share y dilución, 6) cross-sell, 7) monetización de la IA, 8) valoración y CAGR."
  - "Thesis breakers sin KPI (se juzgan en cada revisión, con las preguntas maestras): pérdida estructural de clientes/workflows; pérdida clara de share frente a CargoWise/suites/especialistas; varias adquisiciones con ROIC mediocre; M&A necesario para ocultar deterioro orgánico; la GLN no produce switching costs relevantes; la IA reduce la diferenciación sin compensación. Hoy: cross-sell 🟢, retención/pricing 🟡, posición competitiva 🟢/🟡, ROIC del M&A 🟡 (la principal hipótesis sin demostrar), IA 🟡."
  - "Zonas de precio: >$95 exigente · $80–95 razonable (calidad a precio razonable) · $70–75 atractivo · <$70 oportunidad fuerte si la tesis sigue intacta. El caso base no necesita expansión de múltiplo."
master_questions:
  - "¿Ha cambiado la trayectoria del crecimiento o alguno de sus motores (orgánico, contribución del M&A, cross-sell, pricing, clientes, nuevos productos)?"
  - "¿Ha cambiado materialmente la ventaja competitiva o la posición frente a alternativas (GLN, switching costs, CargoWise, project44, suites, especialistas, IA)?"
  - "¿Está cambiando la calidad de la asignación de capital (ROIC del M&A, recompras, SBC, dilución, integración)?"
  - "¿Ha cambiado la calidad económica o financiera del negocio (márgenes, CFO, FCF, FCF/share, balance, calidad contable)?"
  - "¿Ha cambiado alguna hipótesis crítica o, como consecuencia, nuestra valoración (evidencia → hipótesis → mecanismo económico → valoración)?"
  - "¿La plataforma se está haciendo realmente más difícil de sustituir? ¿Cada año que pasa un cliente tiene más motivos económicos y operativos para permanecer en Descartes (retención → cross-sell → workflows → conexiones → pricing → win/loss → orgánico → FCF/share)?"
  - "¿Qué evidencia nueva favorece al Bull case y cuál al Bear case?"
valuation:
  question: "Economic FCF/share ≈ $3,38 (FCF anualizado ~$304M; ~$289M tras SBC; ~85,5M acciones). A ~$80–81 → FCF yield económico ≈ 4,2%. ¿Puede DSGX hacer crecer el FCF/share alrededor de un 8–10% durante muchos años? Zonas: >$95 exigente · $80–95 razonable · $70–75 atractivo · <$70 oportunidad fuerte."
  columns:
    - {key: name, label: Escenario}
    - {key: fcf_ps_cagr, label: FCF/share CAGR, format: pct}
    - {key: multiple, label: P/FCF terminal}
    - {key: cagr_5y, label: CAGR precio 5a, format: pct}
    - {key: cagr_doc, label: CAGR precio 10a, format: pct}
  scenarios:
    - {name: Bear, fcf_ps_cagr: 6, multiple: "22x", cagr_5y: 4, cagr_doc: 5}
    - {name: Prudente, fcf_ps_cagr: 8, multiple: "24x", cagr_5y: 8, cagr_doc: 8}
    - {name: Base, fcf_ps_cagr: 9, multiple: "26x", cagr_5y: 11, cagr_doc: 10}
    - {name: Bull razonable, fcf_ps_cagr: 10, multiple: "28x", cagr_5y: 14, cagr_doc: 12}
    - {name: Bull, fcf_ps_cagr: 12, multiple: "30x", cagr_5y: 17, cagr_doc: 15}
