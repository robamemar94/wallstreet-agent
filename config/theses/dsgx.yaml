         how_to_measure: "Economía del software", green_text: ">75% estable", amber_text: "<75%", red_text: "Deterioro persistente",
         auto_metric: gross_margin}

  - key: ebitda
    name: Adjusted EBITDA margin
    description: "H4 — ¿El margen EBITDA sube, se mantiene o cae? ¿Es inversión temporal o deterioro? (EBITDA +19% vs revenue +13% en H1 FY27: operating leverage, sin extrapolarlo)"
