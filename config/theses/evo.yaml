# Transcrito de data/theses/Evolution_Tesis_Maestra_v5.1_Framework_v2.8_KPIs_27-09-2026.pdf (27/09/2026)
# Se monitorizan los KPIs CUANTIFICABLES del «Dashboard maestro de EVO» (H1–H6, H8–H10) y las geografías de la tabla
# «KPIs de producto y geografía» (Europa, Asia, LatAm). H7 moat cualitativo y H11 regulación van a la lista de vigilancia
# (junto al lado cualitativo de Brasil y Asia) y H12 a la valoración.
# Umbrales: los del dashboard; donde el dashboard solo da una referencia verbal se usa la cifra explícita de la propia
# tesis (6.5 «Qué cambiaría nuestra interpretación», 8.3 «Thesis breakers», 1.7 «Tesis central»). Ver comentarios.
# El documento completo está en config/theses/evo.md.
ticker: EVO.ST
title: Evolution AB · Tesis Maestra
version: "v5.1 (framework v2.8)"
reference_date: "2026-09-27"
reference_price: 816
source_document: data/theses/Evolution_Tesis_Maestra_v5.1_Framework_v2.8_KPIs_27-09-2026.pdf
document: config/theses/evo.md
verdict: INTACTA
summary: >-
  Contenido diferencial → distribución amplia → utilización por jugadores → ingresos de alta contribución → FCF elevado
  → reinversión + recompras → FCF/share. Evolution puede seguir siendo un compounder aunque ya no crezca como en
  2021–2023 si el moat mantiene la economía del Live, RNG crece, Norteamérica compensa la madurez, Brasil no se convierte
  en un agujero estructural y el FCF se transforma en FCF/share con recompras a precios razonables. Estado: WATCH / INTACT.
hypothesis: "Caso base: ~3–4% de crecimiento del FCF del negocio y ~1,5–2% anual de reducción de acciones → ~5–6% de crecimiento de FCF/share. No exige volver al 10–15%."
hypotheses:
  H1: Live mantiene el moat
  H2: El margen sigue siendo estructural
  H3: RNG vuelve a aportar crecimiento
  H4: Norteamérica es runway real
  H5: LatAm crece sin dependencia excesiva de Brasil
  H6: Asia se estabiliza
  H7: El moat se conserva
  H8: La caja se convierte bien
  H9: Las recompras crean valor por acción
  H10: El balance permite flexibilidad
  H11: Regulación no destruye economics
  H12: La valoración sigue ofreciendo retorno
rules:
  - "No todos los KPIs tienen un umbral numérico rígido. Cuando no existe una relación económica suficientemente estable, se utiliza tendencia + contexto."
  - "Un KPI rojo no rompe automáticamente la tesis: primero hay que identificar si es temporal, cíclico, regulatorio o estructural. Un solo trimestre negativo no es un thesis breaker."
  - "La tesis se debilita cuando varios KPIs de la misma hipótesis se deterioran simultáneamente o cuando cambia la relación económica que sustentaba la hipótesis."
  - "La valoración se actualiza cuando cambia la trayectoria del FCF/acción, la reinversión, el número de acciones o el múltiplo terminal razonable; no por cualquier movimiento trimestral."
  - "No se convierte una ausencia de disclosure en una señal positiva o negativa; cuando el dato no permite precisión suficiente se marca como incertidumbre."
master_questions:
  - "¿Siguen estabilizando Live y Europa? ¿Cuál es el efecto cuantificado de Brasil?"
  - "¿Cuál es el impacto real de la MP brasileña desde el 6/10/2026 y su evolución jurídica/regulatoria?"
  - "¿Cómo evoluciona Asia y qué evidencia hay sobre la redistribución ilegal/cyber?"
  - "RNG: ¿se mantiene un crecimiento >7–9%?"
  - "Norteamérica: ¿crecimiento y monetización de los nuevos estudios/estados?"
  - "¿Cuántas acciones quedan tras la cancelación y las nuevas recompras? ¿A qué precio se recompra frente al valor intrínseco?"
  - "FCF 2026 completo: ¿se normalizan el working capital y el capex?"
  - "Competencia: ¿qué señales económicas hay frente a Pragmatic y Playtech?"
valuation:
  question: "Base normalizada: FCF ~€1,10B, EUR/SEK ~11,2, ~183,1M acciones → ~67,3 SEK de FCF/acción; a 816 SEK ≈12,1x FCF y ≈8,2% FCF yield."
  columns:
    - {key: name, label: Escenario}
    - {key: fcf_ps_cagr, label: FCF/share CAGR, format: pct}
    - {key: multiple, label: Múltiplo terminal}
    - {key: cagr_doc, label: CAGR 10a (tesis), format: pct}
    - {key: note, label: Fuente}
  scenarios:
    - {name: Bear, fcf_ps_cagr: 2, multiple: "15x", cagr_doc: 4, note: "«Si el FCF/share solo crece 2% y el múltiplo termina en 15x, el CAGR a 10 años cae hacia ~4%»"}
    - {name: Base, fcf_ps_cagr: 5.5, multiple: "18x", cagr_doc: 10, note: "Matriz estructural (g 5,5%, terminal 18x); estimación central ~10% a 10 años"}
    - {name: Bull, fcf_ps_cagr: 7.5, multiple: "22x", cagr_doc: 14, note: "«Si FCF/share crece 7,5% y el múltiplo alcanza 22x, el CAGR supera 14%»"}
