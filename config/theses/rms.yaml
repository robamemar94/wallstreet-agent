# Transcrito de data/theses/Hermes_Tesis_Maestra_v2.6_updated.md (28/09/2026)
# Cuadro de mando: los 7 KPIs del «7.2 Dashboard principal». Los «controles financieros» (net cash, acciones, capex/
# capacidad) y las métricas auxiliares NO van al cuadro: la tesis dice que solo explican lo que detecta un KPI; van a las
# reglas para que la revisión de resultados los tenga en cuenta. Umbrales: solo los que da la propia tesis (H5 margen
# ~40%, H6 FCF/share base ~8,5% y refutación <5–6%, 6.3 crecimiento <5%). Donde solo hay semáforo sin cifra (Leather
# Goods, pricing/volumen, ROIC, geografías) el KPI es cualitativo con semáforo MANUAL según la hipótesis y su refutación.
# Hermès publica cuentas semestrales (ingresos trimestrales): margen y FCF se registran por semestre.
# El documento completo está en config/theses/rms.md.
ticker: RMS.PA
title: Hermès International · Tesis Maestra
version: "v2.6"
reference_date: "2026-09-28"
reference_price: 1354
source_document: data/theses/Hermes_Tesis_Maestra_v2.6_updated.md
document: config/theses/rms.md
verdict: INTACTA
summary: >-
  Marca extraordinariamente deseada + oferta deliberadamente limitada + artesanía difícil de escalar + distribución
  controlada + cultura familiar de largo plazo. La demanda crece más rápido que la capacidad → pricing power → margen ~41%
  → FCF → reinversión en talleres. La cuestión no es si el negocio es bueno, sino si puede sostener ~8–9% de crecimiento
  del FCF/acción durante años y si el precio permite capturar una rentabilidad suficiente. Estado: INTACT — WATCH valoración.
hypothesis: "Si Hermès consigue aumentar capacidad sin destruir exclusividad, puede mantener ~8–9% de crecimiento de FCF por acción a largo plazo; la inversión depende menos de la expansión del múltiplo que de mantener esa economía otra década."
hypotheses:
  H1: "La marca conserva su poder de pricing (🟢)"
  H2: "La demanda seguirá superando la capacidad (🟢)"
  H3: "Leather Goods seguirá siendo un motor importante (🟢)"
  H4: "Puede aumentar capacidad sin destruir exclusividad (🟢/🟡)"
  H5: "El margen operativo puede mantenerse alrededor del 40% (🟢)"
  H6: "El crecimiento puede normalizarse en ~8–9% de FCF/share (🟡)"
  H7: "El modelo artesanal seguirá generando altos retornos (🟢)"
  H8: "Asia ex-Japón se estabilizará (🟡)"
  H9: "La familia preservará la cultura y disciplina de capital (🟢)"
  H10: "La valoración permitirá una rentabilidad atractiva (🟡)"
rules:
  - "No son thesis breaker: un trimestre débil, una caída temporal de China, una corrección del precio o un descenso temporal del FCF por más capex. Distinguir ciclo, inversión deliberada y deterioro estructural."
  - "Rompe la tesis la combinación persistente de: crecimiento <5%, pérdida de pricing power, caída material del margen, demanda inferior a capacidad, deterioro del ROIC, exceso de producción, cambio de cultura o M&A/deuda agresivos. Si aparecen varios a la vez: INTACT/WATCH → WEAKENING o BROKEN."
  - "Valoración y crecimiento se monitorizan por separado de la calidad del negocio: la principal amenaza es que siga siendo extraordinaria pero el crecimiento se normalice antes o el múltiplo terminal sea menor."
  - "No asumir que el ROIC histórico del 50–70% se mantiene: el ROIC incremental de nuevos talleres puede ser inferior."
  - "No asumir automáticamente que todos los ajustes no-GAAP son económicos: distinguir beneficio, CFO, capex y FCF."
  - "Controles financieros (fuera del cuadro de mando, revisar cuando puedan afectar a la tesis): net cash (resiliencia), shares outstanding (dilución/recompras) y capex/capacidad (que los talleres nuevos generen crecimiento y retornos)."
  - "El KPI detecta → las métricas auxiliares explican: ventas y número de empleados, talleres, tiendas, capex por taller, mix geográfico detallado, FCF total y working capital se consultan solo para diagnosticar un cambio."
master_questions:
  - "¿Ha cambiado la trayectoria del crecimiento?"
  - "¿Ha cambiado el moat?"
  - "¿La reinversión está generando buenos retornos?"
  - "¿Ha cambiado la calidad financiera?"
  - "¿Alguna hipótesis crítica se ha debilitado?"
  - "¿Qué evidencia favorece a Bull?"
  - "¿Qué evidencia favorece a Bear?"
  - "¿Tenemos que modificar la valoración?"
  - "¿Es la caída del crecimiento del FCF/acción (<5%) un efecto temporal de divisas/capex o un deterioro estructural de la conversión de caja?"
  - "¿Es la caída de prêt-à-porter, relojes y joyería un efecto de China y de la base comparable o una pérdida de deseabilidad fuera de marroquinería?"
valuation:
  question: "FCF normalizado H1 2026 × 2 ≈ €4.364M / ~105,6M acciones ≈ €41,3 de FCF/acción; caja neta ≈ €122/acción (la tesis la suma al valor terminal, el recálculo vivo no). Valor justo base ≈ €1.700 (WACC 8,5%)."
  columns:
